<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学习打卡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">月</button>
<div id="celebration" role="status" aria-live="polite" aria-hidden="true">
<div class="celebration-message">
<div class="confetti" aria-hidden="true">
<i></i><i></i><i></i><i></i><i></i><i></i>
</div>
<strong>今日完成！</strong>
<span>今天的任务全部完成了</span>
</div>
</div>
<h1>今日任务</h1>
<p id="streak-text">已连续打卡 0 天</p>
<div id="week-picker">
<label for="week-select">周期表：</label>
<select id="week-select"></select>
</div>
<nav id="subjects" aria-label="学科筛选"></nav>
<div id="add-subject-box">
<input id="new-subject" placeholder="输入新学科，比如：化学" maxlength="20">
<button id="add-subject" type="button">添加学科</button>
</div>
<div id="upload-box">
<input id="md-file" type="file" accept=".md,text/markdown" hidden>
<button id="upload-md" type="button">上传任务 md</button>
<span id="upload-status" aria-live="polite"></span>
</div>
<div id="tasks"></div>
<div id="progress">
<div id="progress-bar"></div>
</div>
<p id="progress-text">今日进度：0%</p>
<section id="study-timer" aria-label="学习计时器">
<h2>学习计时器</h2>
<div class="timer-display">
<p>本轮时间 <strong id="round-time">00:00:00</strong></p>
<p>今天累计 <strong id="total-time">00:00:00</strong></p>
</div>
<div class="timer-actions">
<button id="timer-toggle" type="button">开始</button>
<button id="timer-finish" type="button">结束本轮</button>
</div>
</section>
<section id="heatmap-section" aria-label="最近 12 周打卡热力图">
<h2>打卡热力图</h2>
<div id="heatmap" role="grid"></div>
<p id="heatmap-detail" aria-live="polite">点击日期查看完成情况</p>
</section>
<div id="add-box">
<input id="new-task" placeholder="输入新任务，比如：复习 10 个单词">
<button id="add-task">添加</button>
</div>
<h2>倒计时</h2>
<ul id="countdowns"></ul>
<script src="app.js"></script>
</body>
</html>

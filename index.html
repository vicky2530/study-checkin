<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学习打卡</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>今日任务</h1>
<div id="week-picker">
<label for="week-select">周期表：</label>
<select id="week-select"></select>
</div>
<div id="tasks"></div>
<div id="progress">
<div id="progress-bar"></div>
</div>
<p id="progress-text">今日进度：0%</p>
<div id="add-box">
<input id="new-task" placeholder="输入新任务，比如：复习 10 个单词">
<button id="add-task">添加</button>
</div>
<h2>倒计时</h2>
<ul id="countdowns"></ul>
<h2>四级单词</h2>
<div id="words"></div>
<script src="app.js"></script>
</body>
</html>

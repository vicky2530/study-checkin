<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学科学习</title>
<link rel="stylesheet" href="subject.css">
</head>
<body>
<button id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">月</button>
<a class="back-link" href="index.html">返回打卡页</a>
<main>
<h1 id="subject-title">学科学习</h1>
<nav id="module-entries" aria-label="学科学习模块" hidden></nav>
<div id="subject-content">
<div id="week-picker">
<label for="week-select">周期表：</label>
<select id="week-select"></select>
</div>
<section aria-labelledby="tasks-heading">
<h2 id="tasks-heading">本周任务</h2>
<div id="tasks"></div>
<div id="empty-state" hidden>本周没有该学科的任务</div>
</section>
<section class="progress-section" aria-label="学科进度">
<h2>本周进度</h2>
<div id="progress"><div id="progress-bar"></div></div>
<p id="progress-text">0%（0/0）</p>
</section>
</div>
</main>
<script src="subject.js"></script>
</body>
</html>

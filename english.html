  });
  html += "</div>";
  return html;
}
</script>

<script>
/* ============ 翻译（真题 / 模拟题两板块） ============ */
var curTrTab = "real"; /* "real" 真题 | "mock" 模拟题 */
var curTrItem = null; /* 题目 id */
var trChecked = false;
var trTopic = "all";
var trPage = 1;
var trMyDraft = "";
var TR_PAGE_SIZE = 10;

function trReal() { return window.ENG_TRANSLATION_REAL || []; }
function trMock() { return window.ENG_TRANSLATION_MOCK || []; }
function trPatternNotes() { return window.ENG_PATTERN_NOTES || []; }
function trFind(tab, id) {
  var arr = tab === "real" ? trReal() : trMock();
  for (var i = 0; i < arr.length; i++) { if (arr[i].id === id) return arr[i]; }
  return null;
}
function patternText(p) {
  if (p && typeof p === "object") {
    return (p.title || p.key || p.id || "") + (p.content || p.text || p.note ? "：" + (p.content || p.text || p.note) : "");
  }
  var notes = trPatternNotes();
  for (var i = 0; i < notes.length; i++) {
    var n = notes[i];
    if (n && (n.id === p || n.key === p || n.title === p)) {
      return (n.title || n.id || "") + "：" + (n.content || n.text || n.note || "");
    }
  }
  return String(p || "");
}
function renderTranslationHome() {
  var real = trReal(), mock = trMock();
  var html = '<div class="chips">';
  html += '<button class="' + (curTrTab === "real" ? "active" : "") + '" onclick="curTrTab=\'real\';curTrItem=null;trPage=1;trMyDraft=\'\';renderPractice()">真题（' + real.length + ' 道）</button>';
  html += '<button class="' + (curTrTab === "mock" ? "active" : "") + '" onclick="curTrTab=\'mock\';curTrItem=null;trPage=1;trMyDraft=\'\';renderPractice()">模拟题（' + mock.length + ' 道）</button>';
  html += "</div>";
  var arr = curTrTab === "real" ? real : mock;
  if (curTrTab === "mock") {
    var topics = [];
    mock.forEach(function (it) { if (it.topic && topics.indexOf(it.topic) < 0) topics.push(it.topic); });
    html += '<div class="card"><label>按话题筛选</label><select onchange="trTopic=this.value;trPage=1;renderPractice()">';
    html += '<option value="all"' + (trTopic === "all" ? " selected" : "") + ">全部话题</option>";
    topics.forEach(function (t) {
      html += '<option value="' + esc(t) + '"' + (trTopic === t ? " selected" : "") + ">" + esc(t) + "</option>";
    });
    html += "</select></div>";
    if (trTopic !== "all") arr = arr.filter(function (it) { return it.topic === trTopic; });
  }
  var total = arr.length;
  var pages = Math.max(1, Math.ceil(total / TR_PAGE_SIZE));
  if (trPage > pages) trPage = pages;
  var start = (trPage - 1) * TR_PAGE_SIZE;
  var pageItems = arr.slice(start, start + TR_PAGE_SIZE);
  html += '<div class="card"><h2>' + (curTrTab === "real" ? "真题" : "模拟题") + " · 共 " + total + ' 道</h2>';
  html += '<p class="muted">' + (curTrTab === "real" ? "往年四级段落翻译真题，每道标明年份和套数。" : "按真题标准自编的模拟题，明确标注为模拟题，不是真题。") + "</p></div>";
  html += '<div class="card"><div class="ep-list">';
  pageItems.forEach(function (it) {
    html += '<div class="ep-item" onclick="curTrItem=\'' + esc(it.id).replace(/'/g, "\\'") + '\';trChecked=false;trMyDraft=\'\';renderPractice()"><span>' + esc(it.source || "") + (it.topic ? " · " + esc(it.topic) : "") + '</span><span class="muted">›</span></div>';
  });
  html += "</div>";
  if (pages > 1) {
    html += '<div style="margin-top:10px"><button class="btn ghost small" onclick="trPage=Math.max(1,trPage-1);renderPractice()" ' + (trPage <= 1 ? "disabled" : "") + ">上一页</button> ";
    html += '<span class="muted">第 ' + trPage + " / " + pages + " 页</span> ";
    html += '<button class="btn ghost small" onclick="trPage=Math.min(' + pages + ',trPage+1);renderPractice()" ' + (trPage >= pages ? "disabled" : "") + ">下一页</button></div>";
  }
  html += "</div>";
  return html;
}
function renderTranslationDetail() {
  var it = trFind(curTrTab, curTrItem);
  if (!it) return renderTranslationHome();
  var tabName = curTrTab === "real" ? "真题" : "模拟题";
  var html = '<button class="btn ghost" onclick="curTrItem=null;trChecked=false;trMyDraft=\'\';renderPractice()">‹ 返回' + tabName + '列表</button>';
  html += '<div class="card"><h2>' + esc(it.source || "") + (it.topic ? " · " + esc(it.topic) : "") + "</h2>";
  html += '<p class="muted">' + tabName + "</p>";
  html += "<h3>中文原文</h3><pre class=\"light\">" + esc(it.chinese || "") + "</pre>";
  html += '<h3>你的译文</h3><p class="muted">先自己翻译，写完再点自查。</p>';
  html += '<textarea id="tr-my" oninput="trMyDraft=this.value" placeholder="在这里写你的英文译文……">' + esc(trMyDraft) + "</textarea>";
  html += '<div style="margin-top:8px"><button class="btn" onclick="trChecked=true;renderPractice()" ' + (trChecked ? "disabled" : "") + '>自查</button></div>';
  if (trChecked) {
    html += '<div class="answer-box open"><h3>参考译文</h3>' + tappableText(it.reference, "translation", 0, "none");
    html += "<h3>逐句解析</h3>";
    (it.sentences || []).forEach(function (s, i) {
      html += '<div class="explain-sec"><p><b>第 ' + (i + 1) + " 句：</b>" + esc(s.zh || "") + "</p><p>" + esc(s.en || "") + "</p>" + (s.note ? '<p class="muted">' + esc(s.note) + "</p>" : "") + "</div>";
    });
    html += curTrTab === "mock" ? "<h3>本话题生词</h3><p class=\"muted\">生词按话题汇总，不一定都出现在这段正文里。</p>" : "<h3>生词汇总</h3>";
    (it.words || []).forEach(function (w) {
      html += '<div class="dict-row"><b>' + esc(w.word) + '</b> <span style="color:var(--accent)">' + esc(w.pos || "") + "</span> " + esc(w.meaning || "") + '<div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(w.word).replace(/'/g, "\\'") + '\')">读音</button></div></div>';
    });
    html += "<h3>句式考点</h3>";
    (it.patterns || []).forEach(function (p) {
      html += '<div class="explain-sec"><p>' + esc(patternText(p)) + "</p></div>";
    });
    html += '<button class="btn ghost small" onclick="addMistakeFromTranslation(\'' + curTrTab + "','" + esc(it.id).replace(/'/g, "\\'") + '\')">加入错题库</button>';
    html += "</div>";
  }
  html += "</div>";
  return html;
}
function addMistakeFromTranslation(tab, id) {
  var it = trFind(tab, id);
  if (!it) return;
  var my = trMyDraft ? trMyDraft.trim() : "";
  openMistakeForm({
    module: "translation",
    title: (tab === "real" ? "翻译真题 · " : "翻译模拟题 · ") + (it.source || ""),
    question: it.chinese || "",
    myAnswer: my || "（未写译文）",
    correctAnswer: it.reference || ""
  });
}

/* ============ 写作（分主题 · 模拟题 + 真题） ============ */
var curWTopic = "education";
var curWFilter = "all"; /* "all" 全部 | "mock" 模拟题 | "real" 真题 */
var curWItem = null; /* 题目 id */
var wChecked = false;
var wDraft = "";

function wMock() { return window.ENG_WRITING_MOCK || []; }
function wReal() { return window.ENG_WRITING_REAL || []; }
function wTopics() { return window.ENG_WRITING_TOPICS || []; }
function wTopicById(id) {
  var ts = wTopics();
  for (var i = 0; i < ts.length; i++) { if (ts[i].id === id) return ts[i]; }
  return null;
}
function wFind(id) {
  var arr = wMock().concat(wReal());
  for (var i = 0; i < arr.length; i++) { if (arr[i].id === id) return arr[i]; }
  return null;
}
function wCountWords(text) {
  if (!text) return 0;
  return text.split(/\s+/).filter(function (w) { return w.length > 0; }).length;
}
function renderWritingHome() {
  var topics = wTopics();
  var mock = wMock(), real = wReal();
  var html = '<div class="chips">';
  topics.forEach(function (t) {
    var mc = mock.filter(function (q) { return q.themeId === t.id; }).length;
    var rc = real.filter(function (q) { return q.themeId === t.id; }).length;
    html += '<button class="' + (t.id === curWTopic ? "active" : "") + '" onclick="curWTopic=\'' + t.id + '\';curWItem=null;wChecked=false;wDraft=\'\';renderPractice()">' + esc(t.name) + '（模拟' + mc + ' · 真题' + rc + '）</button>';
  });
  html += "</div>";
  var topic = wTopicById(curWTopic) || topics[0];
  if (!topic) return html + '<div class="card">写作数据尚未加载。</div>';
  var list = mock.concat(real).filter(function (q) { return q.themeId === topic.id; });
  var mCount = 0, rCount = 0;
  list.forEach(function (q) { if (q.kind === "real") rCount++; else mCount++; });
  html += '<div class="card"><h2>' + esc(topic.name) + ' · 模拟题 ' + mCount + ' 道 + 真题 ' + rCount + ' 道</h2>';
  if (topic.intro) html += '<p class="muted">' + esc(topic.intro) + '</p>';
  html += '<p class="muted">每道题先自己写（120–180 词，30 分钟），写完点自查看范文和逐句解析。</p></div>';
  html += '<div class="card"><h3>优美句式</h3>';
  (topic.sentences || []).forEach(function (s) {
    html += '<div class="dict-row"><b>' + esc(s.en) + '</b><div>' + esc(s.zh || "") + '</div></div>';
  });
  html += '<h3>优美词组</h3>';
  (topic.phrases || []).forEach(function (p) {
    html += '<div class="dict-row"><b>' + esc(p.en) + '</b><div>' + esc(p.zh || "") + '</div></div>';
  });
  html += '<h3>“低分表达 → 高分表达”替换表</h3>';
  (topic.upgrades || []).forEach(function (u) {
    html += '<div class="dict-row"><b style="color:var(--red)">' + esc(u.low || "") + '</b> → <b style="color:var(--green)">' + esc(u.high || "") + '</b><div>' + esc(u.zh || "") + '</div></div>';
  });
  html += '</div>';
  html += '<div class="chips">';
  html += '<button class="' + (curWFilter === "all" ? "active" : "") + '" onclick="curWFilter=\'all\';renderPractice()">全部（' + list.length + ' 道）</button>';
  html += '<button class="' + (curWFilter === "mock" ? "active" : "") + '" onclick="curWFilter=\'mock\';renderPractice()">模拟题（' + mCount + ' 道）</button>';
  html += '<button class="' + (curWFilter === "real" ? "active" : "") + '" onclick="curWFilter=\'real\';renderPractice()">真题（' + rCount + ' 道）</button>';
  html += "</div>";
  if (curWFilter !== "mock") {
    html += '<p class="muted">真题说明：各出版社对第1/2/3套的编号不完全一致，同一场次的三道题以题面为准。</p>';
  }
  var show = list.filter(function (q) { return curWFilter === "all" || (curWFilter === "mock" ? q.kind !== "real" : q.kind === "real"); });
  html += '<div class="card"><div class="ep-list">';
  show.forEach(function (q) {
    var label = (q.kind === "real" ? "真题 · " + (q.source || "") : "模拟题") + " · " + (q.title || "") + (q.type ? "（" + q.type + "）" : "");
    html += '<div class="ep-item" onclick="curWItem=\'' + esc(q.id).replace(/'/g, "\\'") + '\';wChecked=false;wDraft=\'\';renderPractice()"><span>' + esc(label) + '</span><span class="muted">›</span></div>';
  });
  html += "</div></div>";
  return html;
}
function renderWritingDetail() {
  var it = wFind(curWItem);
  if (!it) return renderWritingHome();
  var isReal = it.kind === "real";
  var topicName = (wTopicById(it.themeId) || {}).name || "写作";
  var html = '<button class="btn ghost" onclick="curWItem=null;wChecked=false;wDraft=\'\';renderPractice()">‹ 返回' + esc(topicName) + '列表</button>';
  html += '<div class="card"><h2>' + esc(it.title || "") + '</h2>';
  html += '<p class="muted">' + (isReal ? "真题 · " + esc(it.source || "") : "模拟题") + (it.type ? " · " + esc(it.type) : "") + ' · 120–180 词 · 30 分钟</p>';
  html += "<h3>题目要求</h3><pre class=\"light\">" + esc(it.prompt || "") + "</pre>";
  html += '<h3>你的作文</h3><p class="muted">先自己写满 120–180 词，写完再点自查。</p>';
  html += '<textarea id="w-my" oninput="wDraft=this.value;var c=document.getElementById(\'w-count\');if(c)c.textContent=wCountWords(this.value)+\' 词\'" placeholder="在这里写你的作文……">' + esc(wDraft) + "</textarea>";
  html += '<p class="muted">已写 <b id="w-count">' + wCountWords(wDraft) + ' 词</b>（要求 120–180 词）</p>';
  html += '<div style="margin-top:8px"><button class="btn" onclick="wChecked=true;renderPractice()" ' + (wChecked ? "disabled" : "") + '>自查</button></div>';
  if (wChecked) {
    html += '<div class="answer-box open"><h3>参考范文' + (isReal ? '（非官方范文）' : '') + '</h3>' + tappableText((it.essay || []).join("\n\n"), "writing", 0, "none");
    html += "<h3>逐句解析</h3>";
    (it.analysis || []).forEach(function (a, i) {
      html += '<div class="explain-sec"><p><b>第 ' + (i + 1) + ' 句：</b>' + esc(a.en || "") + ' <span class="badge topic">' + esc(a.tag || "") + '</span></p>' + (a.note ? '<p class="muted">' + esc(a.note) + "</p>" : "") + "</div>";
    });
    html += '<button class="btn ghost small" onclick="addMistakeFromWriting(\'' + esc(it.id).replace(/'/g, "\\'") + '\')">加入错题库</button>';
    html += "</div>";
  }
  html += "</div>";
  return html;
}
function addMistakeFromWriting(id) {
  var it = wFind(id);
  if (!it) return;
  var my = wDraft ? wDraft.trim() : "";
  openMistakeForm({
    module: "writing",
    title: "写作 · " + (it.title || "") + "（" + (it.kind === "real" ? (it.source || "真题") : "模拟题") + "）",
    question: it.prompt || "",
    myAnswer: my || "（未写作文）",
    correctAnswer: (it.essay || []).join("\n")
  });
}
</script>

<script>
/* ============ 练习题库 ============ */
var curPracticeModule = "listening";
var practiceAnswers = {}; /* qid -> letter */
var practiceChecked = {}; /* qid -> true */

function renderPractice() {
  var ms = window.ENG_MODULES || [];
  var html = '<div class="chips">';
  ms.forEach(function (m) {
    html += '<button class="' + (m.id === curPracticeModule ? "active" : "") + '" onclick="curPracticeModule=\'' + m.id + '\';renderPractice()">' + esc(m.name) + "</button>";
  });
  html += "</div>";
  if (curPracticeModule === "listening") {
    html += curLEpisode ? renderListeningEpisode() : renderListeningHome();
    $("view-practice").innerHTML = html;
    return;
  }
  if (curPracticeModule === "reading") {
    html += curREpisode ? renderReadingEpisode() : renderReadingHome();
    $("view-practice").innerHTML = html;
    return;
  }
  if (curPracticeModule === "translation") {
    html += curTrItem ? renderTranslationDetail() : renderTranslationHome();
    $("view-practice").innerHTML = html;
    return;
  }
  if (curPracticeModule === "cloze") {
    html += curClozeEpisode ? renderClozeEpisode() : renderClozeHome();
    $("view-practice").innerHTML = html;
    return;
  }
  if (curPracticeModule === "matching") {
    html += curMatchingEpisode ? renderMatchingEpisode() : renderMatchingHome();
    $("view-practice").innerHTML = html;
    return;
  }
  if (curPracticeModule === "writing") {
    html += curWItem ? renderWritingDetail() : renderWritingHome();
    $("view-practice").innerHTML = html;
    return;
  }
  var m = moduleById(curPracticeModule) || ms[0];
  if (!m) { $("view-practice").innerHTML = html + '<div class="card">练习题数据尚未加载。</div>'; return; }
  html += '<div class="card"><h2>' + esc(m.name) + ' · 自测题</h2><p class="muted">选出答案后点“自查”看解析，错题可以加入错题库。</p></div>';
  (m.questions || []).forEach(function (q, qi) {
    html += '<div class="card"><h3>' + (qi + 1) + ". " + esc(q.title || "") + "</h3>";
    if (q.passage) html += '<pre class="light">' + esc(q.passage) + "</pre>";
    html += "<p>" + esc(q.prompt || "") + "</p>";
    if (q.options && q.options.length) {
      q.options.forEach(function (op, oi) {
        var letter = "ABCD"[oi];
        var cls = "opt";
        if (practiceAnswers[q.id] === letter) cls += " sel";
        if (practiceChecked[q.id]) {
          if (letter === q.answer) cls += " right";
          else if (practiceAnswers[q.id] === letter) cls += " wrong";
        }
        html += '<button class="' + cls + '" onclick="if(!practiceChecked[\'' + q.id + "']){practiceAnswers['" + q.id + "']='" + letter + '\';renderPractice()}">' + letter + ". " + esc(op) + "</button>";
      });
      html += '<div style="margin-top:8px"><button class="btn small" onclick="practiceChecked[\'' + q.id + "']=true;renderPractice()\" " + (practiceChecked[q.id] ? "disabled" : "") + ">自查</button></div>";
      if (practiceChecked[q.id]) {
        var mine = practiceAnswers[q.id] || "未作答";
        html += '<div class="answer-box open"><div class="' + (mine === q.answer ? "right-ans" : "my-ans") + '"><b>正确答案：</b>' + esc(q.answer) + (mine === q.answer ? "（你答对了）" : "（你选 " + esc(mine) + "，答错了）") + "</div><p>" + esc(q.explain || "") + "</p>";
        if (mine !== q.answer) {
          html += '<button class="btn ghost small" onclick="addMistakeFromPractice(\'' + m.id + "','" + q.id + '\')">加入错题库</button>';
        }
        html += "</div>";
      }
    } else {
      /* 写作题：先自己写，再自查看范文（跟翻译板块一样的流程） */
      html += '<label>先自己写一遍（写完再点自查）</label><textarea id="essay-' + q.id + '" placeholder="在这里写你的作文……"></textarea>';
      html += '<button class="btn ghost small" onclick="this.nextElementSibling.classList.toggle(\'open\')">自查：查看范文与点评</button>';
      html += '<div class="answer-box"><div class="right-ans"><b>范文：</b></div><pre class="light">' + esc(q.answer || "") + '</pre><p>' + esc(q.explain || "") + "</p></div>";
    }
    html += "</div>";
  });
  $("view-practice").innerHTML = html;
}
function addMistakeFromPractice(mid, qid) {
  var m = moduleById(mid);
  if (!m) return;
  var q = null;
  (m.questions || []).forEach(function (x) { if (x.id === qid) q = x; });
  if (!q) return;
  var mine = practiceAnswers[qid] || "未作答";
  var myText = "";
  if (mine && "ABCD".indexOf(mine) >= 0 && q.options) myText = q.options["ABCD".indexOf(mine)];
  var correctText = "";
  if (q.options && "ABCD".indexOf(q.answer) >= 0) correctText = q.options["ABCD".indexOf(q.answer)];
  openMistakeForm({
    module: mid,
    title: m.name + " · " + (q.title || ""),
    question: (q.passage ? q.passage + "\n" : "") + (q.prompt || "") + (q.options ? "\n" + q.options.map(function (o, i) { return "ABCD"[i] + ". " + o; }).join("\n") : ""),
    myAnswer: mine + (myText ? ". " + myText : ""),
    correctAnswer: q.answer + (correctText ? ". " + correctText : "")
  });
}

/* ============ 错题库 ============ */
var curMisFilter = "all";
var misPrefill = null;
function openMistakeForm(prefill) {
  misPrefill = prefill || null;
  switchTab("mistakes");
  renderMistakes();
  setTimeout(function () { var f = $("mis-form"); if (f) f.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
}
function renderMistakes() {
  var ms = window.ENG_MODULES || [];
  var html = '<div class="card"><h2>错题库</h2><p class="muted">每道错题都要写三项分析：错误本身、背后没理解什么、详细解析。我的答案在上（红色），正确答案在下（绿色）。</p></div>';
  html += '<div class="card"><div class="chips">';
  html += '<button class="' + (curMisFilter === "all" ? "active" : "") + '" onclick="curMisFilter=\'all\';renderMistakes()">全部</button>';
  ms.forEach(function (m) {
    html += '<button class="' + (curMisFilter === m.id ? "active" : "") + '" onclick="curMisFilter=\'' + m.id + '\';renderMistakes()">' + esc(m.name) + "</button>";
  });
  html += "</div>";
  var list = getMistakes().filter(function (x) { return curMisFilter === "all" || x.module === curMisFilter; });
  if (!list.length) html += '<p class="muted">错题库是空的。做题错了点“加入错题库”，或在下面手动添加。</p>';
  list.forEach(function (x) {
    var mname = (moduleById(x.module) || {}).name || x.module;
    html += '<div class="card"><h3>' + esc(x.title || "") + ' <span class="badge topic">' + esc(mname) + "</span>" + (x.mastered ? ' <span class="done-mark">已掌握</span>' : "") + "</h3>";
    if (x.question) html += "<p><b>题面：</b>" + esc(x.question) + "</p>";
    html += '<div class="my-ans"><b>我的答案：</b>' + esc(x.myAnswer || "") + '</div><div class="right-ans"><b>正确答案：</b>' + esc(x.correctAnswer || "") + "</div>";
    html += "<p><b>错误本身：</b>" + esc(x.errorItself || "") + "</p>";
    html += "<p><b>背后没理解什么：</b>" + esc(x.notUnderstood || "") + "</p>";
    html += "<p><b>详细解析：</b>" + esc(x.analysis || "") + "</p>";
    html += '<div><button class="btn ghost small" onclick="setMistakeMastered(\'' + x.id + "'," + (!x.mastered) + ');renderMistakes()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteMistake(\'' + x.id + '\');renderMistakes()">删除</button></div>';
    html += "</div>";
  });
  html += "</div>";
  /* 添加表单 */
  html += '<div class="card" id="mis-form"><h2>手动添加错题</h2><p class="muted">标 <b style="color:var(--red)">*</b> 的都要填，缺一项不能保存。</p>';
  html += '<label>所属模块 <b>*</b></label><select id="mf-module">';
  ms.forEach(function (m) { html += '<option value="' + m.id + '"' + (misPrefill && misPrefill.module === m.id ? " selected" : "") + ">" + esc(m.name) + "</option>"; });
  html += "</select>";
  html += '<label>标题 <b>*</b></label><input type="text" id="mf-title" value="' + esc(misPrefill ? misPrefill.title || "" : "") + '">';
  html += '<label>题面 <b>*</b></label><textarea id="mf-question">' + esc(misPrefill ? misPrefill.question || "" : "") + "</textarea>";
  html += '<label>我的答案 <b>*</b></label><textarea id="mf-my" style="min-height:60px">' + esc(misPrefill ? misPrefill.myAnswer || "" : "") + "</textarea>";
  html += '<label>正确答案 <b>*</b></label><textarea id="mf-right" style="min-height:60px">' + esc(misPrefill ? misPrefill.correctAnswer || "" : "") + "</textarea>";
  html += '<label>错误本身 <b>*</b></label><textarea id="mf-err" style="min-height:60px"></textarea>';
  html += '<label>背后没理解什么 <b>*</b></label><textarea id="mf-not" style="min-height:60px"></textarea>';
  html += '<label>详细解析 <b>*</b></label><textarea id="mf-ana"></textarea>';
  html += '<button class="btn" onclick="submitMistake()">保存到错题库</button>';
  html += "</div>";
  $("view-mistakes").innerHTML = html;
}
function submitMistake() {
  var v = function (id) { return $(id).value.trim(); };
  var m = {
    module: v("mf-module"),
    title: v("mf-title"),
    question: v("mf-question"),
    myAnswer: v("mf-my"),
    correctAnswer: v("mf-right"),
    errorItself: v("mf-err"),
    notUnderstood: v("mf-not"),
    analysis: v("mf-ana")
  };
  var missing = [];
  if (!m.title) missing.push("标题");
  if (!m.question) missing.push("题面");
  if (!m.myAnswer) missing.push("我的答案");
  if (!m.correctAnswer) missing.push("正确答案");
  if (!m.errorItself) missing.push("错误本身");
  if (!m.notUnderstood) missing.push("背后没理解什么");
  if (!m.analysis) missing.push("详细解析");
  if (missing.length) { alert("以下几项还没填，不能保存：" + missing.join("、")); return; }
  misPrefill = null;
  addMistake(m);
  renderMistakes();
}

/* ============ 提示词 ============ */
function renderPrompt() {
  var txt = window.ENG_PROMPT || "提示词数据尚未加载。";
  var html = '<div class="card"><h2>提示词</h2><p class="muted">把下面这段提示词复制给 Codex，可以复现这个英语四级学习页面。</p>';
  html += '<button class="btn" onclick="copyPrompt()">一键复制提示词</button>';
  html += '<pre class="light" id="prompt-text">' + esc(txt) + "</pre></div>";
  $("view-prompt").innerHTML = html;
}
function copyPrompt() {
  var txt = window.ENG_PROMPT || "";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { alert("已复制。"); }, function () { fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  var ta = document.createElement("textarea");
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); alert("已复制。"); } catch (e) { alert("复制失败，请手动选中复制。"); }
  document.body.removeChild(ta);
}

/* ============ 初始化 ============ */
function dataReady() {
  return (window.ENG_WORD_DAYS && window.ENG_WORD_DAYS.length) &&
    (window.ENG_PHRASE_DAYS && window.ENG_PHRASE_DAYS.length) &&
    (window.ENG_MODULES && window.ENG_MODULES.length);
}
window.addEventListener("load", function () {
  updateMisCount();
  if (!dataReady()) {
    $("view-learn").innerHTML = '<div class="card"><h2>数据文件未加载完全</h2><p>请确认 eng-words.js、eng-listening-*.js、eng-listening-news-*.js、eng-listening-passage-*.js、eng-dict.js、eng-reading-*.js、eng-cloze-*.js、eng-matching-*.js、eng-lessons.js 与 english.html 在同一目录下。</p></div>';
  }
  renderLearn();
});
</script>

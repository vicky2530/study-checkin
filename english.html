<style>
  :root {
    --primary: #5b6abf;
    --primary-dark: #4a579e;
    --primary-light: #e8eaf6;
    --accent: #7c6bb0;
    --bg: #f4f5fa;
    --card: #ffffff;
    --border: #dfe3f0;
    --text: #2e3245;
    --muted: #6b7086;
    --green: #3f8f6b;
    --amber: #b07f2e;
    --red: #b05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  header { background: linear-gradient(135deg, #5b6abf, #7c6bb0); color: #fff; padding: 20px 16px; text-align: center; }
  header h1 { font-size: 22px; letter-spacing: 2px; }
  header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
  nav.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  nav.tabs button { flex: 1; padding: 13px 4px; border: none; background: none; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
  nav.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 12px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 18px; color: var(--primary-dark); margin-bottom: 6px; }
  .card h3 { font-size: 16px; margin: 12px 0 6px; color: var(--text); }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 20px; margin-right: 6px; }
  .badge.basic { background: #e3f2e9; color: var(--green); }
  .badge.mid { background: #fbf1dd; color: var(--amber); }
  .badge.hard { background: #fbe7e7; color: var(--red); }
  .badge.src { background: var(--primary-light); color: var(--primary-dark); }
  .badge.topic { background: #ede9f7; color: var(--accent); }
  .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font-size: 14px; cursor: pointer; margin: 4px 6px 4px 0; }
  .btn:hover { background: var(--primary-dark); }
  .btn.ghost { background: #fff; color: var(--primary); }
  .btn.ghost:hover { background: var(--primary-light); }
  .btn.danger { background: #fff; color: var(--red); border-color: var(--red); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  pre { background: #2e3245; color: #e8eaf6; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.5; margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
  pre.light { background: #f0f1f8; color: #2e3245; border: 1px solid var(--border); }
  textarea { width: 100%; min-height: 110px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; resize: vertical; }
  input[type="text"], select { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; margin: 4px 0 10px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-top: 8px; }
  label b { color: var(--red); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .toolbar select, .toolbar input[type="text"] { flex: 1; min-width: 120px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips button { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 14px; color: var(--muted); cursor: pointer; }
  .chips button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .explain-sec { border-left: 3px solid var(--primary-light); padding: 4px 0 4px 12px; margin: 10px 0; }
  .explain-sec h4 { font-size: 15px; color: var(--primary-dark); margin-bottom: 4px; }
  .pitfall { background: #fdf6ec; border: 1px solid #f0dfbd; border-radius: 8px; padding: 10px; margin: 8px 0; }
  .pitfall .note { font-size: 13px; color: #8a6d1f; margin-top: 6px; }
  .answer-box { display: none; margin-top: 10px; }
  .answer-box.open { display: block; }
  .done-mark { color: var(--green); font-weight: bold; font-size: 13px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(30, 32, 50, 0.5); display: none; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 20px 10px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 640px; }
  .modal h2 { font-size: 18px; margin-bottom: 10px; }
  .stat { display: inline-block; background: var(--primary-light); color: var(--primary-dark); border-radius: 8px; padding: 6px 12px; font-size: 13px; margin: 0 6px 8px 0; }
  .word-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .word-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: #fff; }
  .word-card .w { font-size: 17px; font-weight: bold; color: var(--primary-dark); }
  .word-card .phon { font-size: 13px; color: var(--muted); }
  .word-card .pos { font-size: 13px; color: var(--accent); }
  .word-card .mean { font-size: 14px; margin-top: 2px; }
  .opt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 14px; cursor: pointer; color: var(--text); }
  .opt:hover { border-color: var(--primary); }
  .opt.sel { border-color: var(--primary); background: var(--primary-light); font-weight: bold; }
  .opt.right { border-color: var(--green); background: #e3f2e9; font-weight: bold; }
  .opt.wrong { border-color: var(--red); background: #fbe7e7; }
  .tap-word { border-bottom: 1px dotted #8a8fb0; cursor: pointer; }
  .tap-word:hover { color: var(--primary); border-bottom-color: var(--primary); }
  .tap-word.mark-hl { background: rgba(255, 233, 110, 0.55); }
  .tap-word.mark-ul { border-bottom: 2px solid var(--primary); }
  .cloze-blank { display: inline-block; min-width: 64px; padding: 1px 8px; margin: 0 2px; border: 1px dashed #8a8fb0; border-radius: 6px; background: #f0f1f8; color: var(--primary-dark); font-family: Georgia, "Times New Roman", serif; font-size: 15px; cursor: pointer; vertical-align: baseline; }
  .cloze-blank:hover { border-color: var(--primary); background: var(--primary-light); }
  .cloze-blank.sel { border-style: solid; border-color: var(--primary); background: var(--primary-light); font-weight: bold; }
  .cloze-blank.filled { border-style: solid; border-color: var(--primary); background: #fff; }
  .cloze-blank.right { border-color: var(--green); background: #e3f2e9; color: var(--green); }
  .cloze-blank.wrong { border-color: var(--red); background: #fbe7e7; color: var(--red); }
  .bank-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .bank-word { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; font-size: 14px; cursor: pointer; color: var(--text); }
  .bank-word:hover { border-color: var(--primary); }
  .bank-word.used { opacity: 0.45; background: #f0f1f8; }
  .bank-word.used:hover { border-color: var(--primary); opacity: 0.75; }
  .pen-toolbar { position: sticky; top: 50px; z-index: 5; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pen-toolbar .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .pen-toolbar button { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: #fff; font-size: 13px; color: var(--muted); cursor: pointer; }
  .pen-toolbar button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .passage { font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.9; }
  .passage p { margin-bottom: 12px; }
  .ep-list { display: flex; flex-direction: column; gap: 6px; }
  .ep-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; }
  .ep-item:hover { border-color: var(--primary); background: var(--primary-light); }
  .player { background: #f0f1f8; border-radius: 10px; padding: 14px; margin: 10px 0; }
  .player .pbar { height: 8px; background: #dfe3f0; border-radius: 5px; overflow: hidden; margin: 10px 0 4px; cursor: pointer; }
  .player .pbar > i { display: block; height: 100%; background: linear-gradient(90deg, #5b6abf, #7c6bb0); border-radius: 5px; width: 0%; }
  .pctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pctrl select { width: auto; margin: 0; padding: 6px 8px; }
  .pctrl .btn { margin: 0; }
  .my-ans { color: var(--red); background: #fdf0f0; border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  .right-ans { color: var(--green); background: #eef7f1; border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
  details { margin: 8px 0; }
  details summary { cursor: pointer; color: var(--primary); font-size: 14px; }
  .dict-row { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
  .dict-row .q { font-size: 14px; margin-bottom: 6px; }
  .dict-row input[type="text"] { margin: 4px 0; }
  .dict-row .res { font-size: 13px; margin-top: 4px; }
  .dict-row .res.ok { color: var(--green); }
  .dict-row .res.no { color: var(--red); }
  @media (max-width: 600px) {
    header h1 { font-size: 19px; }
    .card { padding: 12px; }
    .word-grid { grid-template-columns: 1fr; }
    .passage { font-size: 15px; }
  }
</style>

<body>
<header>
  <h1>英语四级学习</h1>
  <p id="overview">四级核心词汇 · 听力 · 阅读 · 写作翻译 · 错题库</p>
</header>
<nav class="tabs">
  <button id="tab-learn" class="active" onclick="switchTab('learn')">知识点</button>
  <button id="tab-words" onclick="switchTab('words')">单词</button>
  <button id="tab-practice" onclick="switchTab('practice')">练习题库</button>
  <button id="tab-mistakes" onclick="switchTab('mistakes')">错题库 <span id="mis-count"></span></button>
  <button id="tab-prompt" onclick="switchTab('prompt')">提示词</button>
</nav>
<main>
  <section id="view-learn"></section>
  <section id="view-words" style="display:none"></section>
  <section id="view-practice" style="display:none"></section>
  <section id="view-mistakes" style="display:none"></section>
  <section id="view-prompt" style="display:none"></section>
</main>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-box"></div>
</div>

<script>
/* ============ 基础工具 ============ */
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function $(id) { return document.getElementById(id); }
function loadJSON(key, fallback) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function uid() { return Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

/* localStorage keys（只用 eng- 前缀，绝不碰其他已有 key） */
var KEY_WRONG = "eng-wrong-words";
var KEY_MISTAKES = "eng-mistakes";
var KEY_LWORDS = "eng-listening-words";
var KEY_RWORDS = "eng-reading-words";
var KEY_RMARKS = "eng-reading-marks";
var KEY_CWORDS = "eng-cloze-words";
var KEY_CMARKS = "eng-cloze-marks";
var KEY_MWORDS = "eng-matching-words";
var KEY_MMARKS = "eng-matching-marks";

/* 迁移唯一一条旧数据：听力生词 inquiry（basic 第1期，n.，询问，未掌握） */
(function seedListeningWord() {
  try {
    if (!localStorage.getItem(KEY_LWORDS)) {
      saveJSON(KEY_LWORDS, [{ id: "seed-inquiry", edition: "basic", episode: 1, word: "inquiry", pos: "n.", meaning: "询问", mastered: false, createdAt: "2026-11-25T11:44:06.143Z" }]);
    }
  } catch (e) {}
})();

/* ============ 语音（全部走浏览器 speechSynthesis，美式、慢速） ============ */
var synth = window.speechSynthesis;
function pickVoice() {
  if (!synth) return null;
  var vs = synth.getVoices();
  for (var i = 0; i < vs.length; i++) { if (/en[-_]US/i.test(vs[i].lang)) return vs[i]; }
  for (var j = 0; j < vs.length; j++) { if (/^en/i.test(vs[j].lang)) return vs[j]; }
  return vs[0] || null;
}
if (synth && synth.onvoiceschanged !== undefined) { synth.onvoiceschanged = function () {}; }
function speakText(text, rate, onend) {
  if (!synth) { if (onend) onend(); return; }
  var u = new SpeechSynthesisUtterance(text);
  var v = pickVoice();
  if (v) u.voice = v;
  u.lang = "en-US";
  u.rate = rate || 0.75;
  if (onend) u.onend = onend;
  synth.speak(u);
}
function speakWordTwice(word) {
  speakText(word + ". " + word + ".", 0.7);
}
function stopSpeak() { if (synth) synth.cancel(); }

/* ============ 本地词典（由 2000 词 + 词组构成，供点词查词和生词自动填义） ============ */
var LOCAL_DICT = null;
function buildDict() {
  if (LOCAL_DICT) return LOCAL_DICT;
  LOCAL_DICT = {};
  var days = window.ENG_WORD_DAYS || [];
  for (var d = 0; d < days.length; d++) {
    var ws = days[d].words || [];
    for (var i = 0; i < ws.length; i++) {
      var k = String(ws[i].w || "").toLowerCase();
      if (k && !LOCAL_DICT[k]) LOCAL_DICT[k] = { pos: ws[i].pos, meaning: ws[i].meaning, phon: ws[i].phon };
    }
  }
  /* 点词词典 eng-dict.js：牛津式条目（本意+延伸义+例句），有则覆盖单词表里的简版 */
  var dict = window.ENG_DICT || [];
  for (var j = 0; j < dict.length; j++) {
    var e = dict[j] || {};
    var k2 = String(e.word || "").toLowerCase();
    if (!k2) continue;
    LOCAL_DICT[k2] = { pos: e.pos, meaning: e.primary, phon: e.phonetic, primary: e.primary, extended: e.extended || [], examples: e.examples || [] };
  }
  return LOCAL_DICT;
}
function lookupLocal(word) {
  var d = buildDict();
  return d[String(word || "").toLowerCase()] || null;
}

/* ============ 错词库 ============ */
function getWrongWords() { return loadJSON(KEY_WRONG, []); }
function addWrongWord(word, pos, meaning, wrongSpelling, day, source) {
  var list = getWrongWords();
  var key = String(word || "").toLowerCase();
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].word || "").toLowerCase() === key) {
      list[i].wrongSpelling = wrongSpelling || list[i].wrongSpelling;
      list[i].pos = pos || list[i].pos;
      list[i].meaning = meaning || list[i].meaning;
      list[i].mastered = false;
      saveJSON(KEY_WRONG, list);
      return list[i];
    }
  }
  var item = { id: uid(), word: word, pos: pos, meaning: meaning, wrongSpelling: wrongSpelling || "", day: day || null, source: source || "", mastered: false, createdAt: new Date().toISOString() };
  list.unshift(item);
  saveJSON(KEY_WRONG, list);
  return item;
}
function setWrongMastered(id, mastered) {
  var list = getWrongWords();
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) list[i].mastered = mastered; }
  saveJSON(KEY_WRONG, list);
}
function deleteWrongWord(id) {
  saveJSON(KEY_WRONG, getWrongWords().filter(function (x) { return x.id !== id; }));
}

/* ============ 错题库 ============ */
function getMistakes() { return loadJSON(KEY_MISTAKES, []); }
function addMistake(m) {
  var list = getMistakes();
  m.id = uid();
  m.mastered = false;
  m.createdAt = new Date().toISOString();
  list.unshift(m);
  saveJSON(KEY_MISTAKES, list);
  updateMisCount();
  return m;
}
function setMistakeMastered(id, mastered) {
  var list = getMistakes();
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) list[i].mastered = mastered; }
  saveJSON(KEY_MISTAKES, list);
  updateMisCount();
}
function deleteMistake(id) {
  saveJSON(KEY_MISTAKES, getMistakes().filter(function (x) { return x.id !== id; }));
  updateMisCount();
}
function updateMisCount() {
  var n = getMistakes().filter(function (x) { return !x.mastered; }).length;
  var el = $("mis-count");
  if (el) el.textContent = n ? "(" + n + ")" : "";
}

/* ============ 生词汇总（听力 / 阅读） ============ */
function getListeningWords() { return loadJSON(KEY_LWORDS, []); }
function getReadingWords() { return loadJSON(KEY_RWORDS, []); }
function addListeningWord(edition, episode, word, pos, meaning) {
  var list = getListeningWords();
  var key = String(word || "").toLowerCase();
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].word || "").toLowerCase() === key && list[i].edition === edition && list[i].episode === episode) return list[i];
  }
  var item = { id: uid(), edition: edition, episode: episode, word: word, pos: pos || "", meaning: meaning || "", mastered: false, createdAt: new Date().toISOString() };
  list.unshift(item);
  saveJSON(KEY_LWORDS, list);
  return item;
}
function addReadingWord(edition, episode, word, pos, meaning) {
  var list = getReadingWords();
  var key = String(word || "").toLowerCase();
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].word || "").toLowerCase() === key && list[i].edition === edition && list[i].episode === episode) return list[i];
  }
  var item = { id: uid(), edition: edition, episode: episode, word: word, pos: pos || "", meaning: meaning || "", mastered: false, createdAt: new Date().toISOString() };
  list.unshift(item);
  saveJSON(KEY_RWORDS, list);
  return item;
}
function setLWordMastered(id, mastered) {
  var list = getListeningWords();
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) list[i].mastered = mastered; }
  saveJSON(KEY_LWORDS, list);
}
function setRWordMastered(id, mastered) {
  var list = getReadingWords();
  for (var i = 0; i < list.length; i++) { if (list[i].id === id) list[i].mastered = mastered; }
  saveJSON(KEY_RWORDS, list);
}
function deleteLWord(id) { saveJSON(KEY_LWORDS, getListeningWords().filter(function (x) { return x.id !== id; })); }
function deleteRWord(id) { saveJSON(KEY_RWORDS, getReadingWords().filter(function (x) { return x.id !== id; })); }

/* ============ 阅读标记笔（按期存 localStorage，键：版本-期号 -> {篇章索引: {"段落:词序号": "hl"|"ul"}}） ============ */
function getReadingMarks() { return loadJSON(KEY_RMARKS, {}); }
function marksKey(edition, episode) { return edition + "-" + episode; }
function getEpisodeMarks(edition, episode) {
  var all = getReadingMarks();
  return all[marksKey(edition, episode)] || {};
}
function setEpisodeMarks(edition, episode, marks) {
  var all = getReadingMarks();
  all[marksKey(edition, episode)] = marks;
  saveJSON(KEY_RMARKS, all);
}
function countEpisodeMarks(edition, episode) {
  var marks = getEpisodeMarks(edition, episode);
  var n = 0;
  Object.keys(marks).forEach(function (pi) { n += Object.keys(marks[pi]).length; });
  return n;
}

/* ============ 选词填空生词与标记（key：eng-cloze-words / eng-cloze-marks，与阅读分开存） ============ */
function getClozeWords() { return loadJSON(KEY_CWORDS, []); }
function addClozeWord(edition, episode, word, pos, meaning) {
  var list = getClozeWords();
  var key = String(word || "").toLowerCase();
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].word || "").toLowerCase() === key && list[i].edition === edition && list[i].episode === episode) return list[i];
  }
  var item = { id: uid(), edition: edition, episode: episode, word: word, pos: pos || "", meaning: meaning || "", mastered: false, createdAt: new Date().toISOString() };
  list.unshift(item);
  saveJSON(KEY_CWORDS, list);
  return item;
}
function setCWordMastered(id, mastered) {
  var list = getClozeWords();

}
function deleteCWord(id) { saveJSON(KEY_CWORDS, getClozeWords().filter(function (x) { return x.id !== id; })); }
function getClozeMarks() { return loadJSON(KEY_CMARKS, {}); }
function getClozeEpisodeMarks(edition, episode) {

}

/* ============ 长篇匹配生词与标记（key：eng-matching-words / eng-matching-marks，与阅读、选词填空分开存） ============ */
function getMatchingWords() { return loadJSON(KEY_MWORDS, []); }
function addMatchingWord(edition, episode, word, pos, meaning) {
  var list = getMatchingWords();
  var key = String(word || "").toLowerCase();
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].word || "").toLowerCase() === key && list[i].edition === edition && list[i].episode === episode) return list[i];
  }
  var item = { id: uid(), edition: edition, episode: episode, word: word, pos: pos || "", meaning: meaning || "", mastered: false, createdAt: new Date().toISOString() };
  list.unshift(item);
  saveJSON(KEY_MWORDS, list);
  return item;
}
function setMWordMastered(id, mastered) {

<script>
/* ============ 单词 ============ */
var curWordDay = 1;
var curPhraseDay = 1;
var curWWFilter = "all";
var dictState = {}; /* key: day-wordIndex -> {status: 'ok'|'wrong'|'skip', input} */
var phraseDictState = {};

function renderWords() {
  var days = window.ENG_WORD_DAYS || [];
  var html = '<div class="card"><h2>四级核心词汇</h2><p class="muted">100 天 × 每天 20 词，共 2000 词（星火《30天突破（四级）必考词汇》）。每天跟读 + 默写，默错和默不出来的进错词库。</p></div>';
  html += '<div class="card"><label>选择天数</label><select id="word-day-sel" onchange="curWordDay=+this.value;dictState={};renderWords()">';
  days.forEach(function (d) {
    html += '<option value="' + d.day + '"' + (d.day === curWordDay ? " selected" : "") + ">Day " + d.day + "</option>";
  });
  html += "</select>";
  var day = null;
  days.forEach(function (d) { if (d.day === curWordDay) day = d; });
  if (day) {
    html += '<div style="margin:8px 0"><button class="btn" onclick="playDayWords(' + day.day + ')">跟读本天 20 词（美式、慢速、每词两遍）</button><button class="btn ghost" onclick="stopSpeak()">停止</button></div>';
    html += '<div class="word-grid">';
    (day.words || []).forEach(function (w) {
      html += '<div class="word-card"><div class="w">' + esc(w.w) + '</div><div class="phon">' + esc(w.phon || "") + '</div><div class="pos">' + esc(w.pos || "") + '</div><div class="mean">' + esc(w.meaning || "") + '</div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(w.w).replace(/'/g, "\\'") + '\')">读音</button></div>';
    });
    html += "</div>";
    html += '<h3 style="margin-top:16px">默写练习（只给词性 + 中文，写出英文）</h3><p class="muted">写完点“检查”，不会的点“不会”，都会进错词库。</p>';
    (day.words || []).forEach(function (w, i) {
      var st = dictState[day.day + "-" + i];
      html += '<div class="dict-row"><div class="q"><b>' + (i + 1) + '.</b> ' + esc(w.pos || "") + " " + esc(w.meaning || "") + '</div><input type="text" id="dict-' + i + '" placeholder="写出英文单词" ' + (st ? 'value="' + esc(st.input || "") + '" disabled' : "") + '>';
      html += '<button class="btn small" onclick="checkDict(' + day.day + "," + i + ",'" + esc(w.w).replace(/'/g, "\\'") + "','" + esc(w.pos || "").replace(/'/g, "\\'") + "','" + esc(w.meaning || "").replace(/'/g, "\\'") + '\')" ' + (st ? "disabled" : "") + '>检查</button> ';
      html += '<button class="btn ghost small" onclick="skipDict(' + day.day + "," + i + ",'" + esc(w.w).replace(/'/g, "\\'") + "','" + esc(w.pos || "").replace(/'/g, "\\'") + "','" + esc(w.meaning || "").replace(/'/g, "\\'") + '\')" ' + (st ? "disabled" : "") + '>不会</button>';
      if (st) {
        html += st.status === "ok" ? '<div class="res ok">答对了：' + esc(w.w) + "</div>" : '<div class="res no">正确答案：' + esc(w.w) + "（你写的是：" + esc(st.input || "空") + "，已进错词库）</div>";
      }
      html += "</div>";
    });
    var done = Object.keys(dictState).filter(function (k) { return k.indexOf(day.day + "-") === 0; }).length;
    var okN = Object.keys(dictState).filter(function (k) { return k.indexOf(day.day + "-") === 0 && dictState[k].status === "ok"; }).length;
    if (done) html += '<p class="muted">本天默写进度：' + okN + " / " + done + " 答对（共 20 个）</p>";
  }
  html += "</div>";

  /* 词组与短语 */
  var pdays = window.ENG_PHRASE_DAYS || [];
  html += '<div class="card"><h2>词组与短语</h2><p class="muted">120 个四级核心词组，10 个/天，共 12 天。默错进错词库，标注“来自词组与短语默写”。</p>';
  html += '<label>选择天数</label><select id="phrase-day-sel" onchange="curPhraseDay=+this.value;phraseDictState={};renderWords()">';
  pdays.forEach(function (d) {
    html += '<option value="' + d.day + '"' + (d.day === curPhraseDay ? " selected" : "") + ">Day " + d.day + " · " + esc(d.title || "") + "</option>";
  });
  html += "</select>";
  var pd = null;
  pdays.forEach(function (d) { if (d.day === curPhraseDay) pd = d; });
  if (pd) {
    html += '<div class="word-grid" style="margin-top:8px">';
    (pd.phrases || []).forEach(function (ph) {
      html += '<div class="word-card"><div class="w">' + esc(ph.p) + '</div><div class="mean">' + esc(ph.meaning || "") + '</div><p style="font-size:13px;margin-top:6px">' + esc(ph.ex || "") + '</p><p style="font-size:13px;color:var(--muted)">' + esc(ph.exZh || "") + "</p></div>";
    });
    html += "</div>";
    html += '<h3 style="margin-top:16px">词组默写（只给中文释义，写出英文词组）</h3>';
    (pd.phrases || []).forEach(function (ph, i) {
      var st = phraseDictState[pd.day + "-" + i];
      html += '<div class="dict-row"><div class="q"><b>' + (i + 1) + ".</b> " + esc(ph.meaning || "") + '</div><input type="text" id="pdict-' + i + '" placeholder="写出英文词组" ' + (st ? 'value="' + esc(st.input || "") + '" disabled' : "") + '>';
      html += '<button class="btn small" onclick="checkPhraseDict(' + pd.day + "," + i + ",'" + esc(ph.p).replace(/'/g, "\\'") + "','" + esc(ph.meaning || "").replace(/'/g, "\\'") + '\')" ' + (st ? "disabled" : "") + '>检查</button> ';
      html += '<button class="btn ghost small" onclick="skipPhraseDict(' + pd.day + "," + i + ",'" + esc(ph.p).replace(/'/g, "\\'") + "','" + esc(ph.meaning || "").replace(/'/g, "\\'") + '\')" ' + (st ? "disabled" : "") + '>不会</button>';
      if (st) {
        html += st.status === "ok" ? '<div class="res ok">答对了：' + esc(ph.p) + "</div>" : '<div class="res no">正确答案：' + esc(ph.p) + "（你写的是：" + esc(st.input || "空") + "，已进错词库）</div>";
      }
      html += "</div>";
    });
  }
  html += "</div>";

  /* 错词库 */
  var allWW = getWrongWords();
  html += '<div class="card"><h2>错词库 <span class="muted">（' + allWW.filter(function (x) { return !x.mastered; }).length + " 个未掌握）</span></h2>";
  html += '<div id="ww-add"><label>手动添加错词（单词 + 词性 + 中文必填）</label>';
  html += '<input type="text" id="ww-word" placeholder="单词"><input type="text" id="ww-pos" placeholder="词性，如 v. / n. / adj."><input type="text" id="ww-mean" placeholder="中文意思">';
  html += '<button class="btn small" onclick="manualAddWrong()">添加</button></div>';
  /* 按天查看错词下拉框 */
  html += '<label>按天查看错词</label><select id="ww-filter-sel" onchange="curWWFilter=this.value;renderWords()">';
  html += '<option value="all"' + (curWWFilter === "all" ? " selected" : "") + ">全部（" + allWW.length + " 个）</option>";
  for (var d = 1; d <= 100; d++) {
    var dcnt = allWW.filter(function (x) { return x.day === d; }).length;
    html += '<option value="day-' + d + '"' + (curWWFilter === "day-" + d ? " selected" : "") + ">Day " + d + " · " + dcnt + " 个错词</option>";
  }
  var phCnt = allWW.filter(function (x) { return x.source === "来自词组与短语默写" || x.pos === "词组"; }).length;
  var manCnt = allWW.filter(function (x) { return x.source === "手动添加"; }).length;
  html += '<option value="phrases"' + (curWWFilter === "phrases" ? " selected" : "") + ">词组与短语（" + phCnt + " 个）</option>";
  html += '<option value="manual"' + (curWWFilter === "manual" ? " selected" : "") + ">手动添加（" + manCnt + " 个）</option>";
  html += "</select>";
  var ww = allWW.filter(function (x) {
    if (curWWFilter === "all") return true;
    if (curWWFilter === "phrases") return x.source === "来自词组与短语默写" || x.pos === "词组";
    if (curWWFilter === "manual") return x.source === "手动添加";
    if (curWWFilter.indexOf("day-") === 0) return x.day === +curWWFilter.slice(4);
    return true;
  });
  if (!ww.length) {
    if (curWWFilter.indexOf("day-") === 0) {
      var dn = curWWFilter.slice(4);
      html += '<p class="muted">Day ' + dn + ' 还没有错词，先去做 Day ' + dn + ' 的默写吧。</p>';
    } else if (!allWW.length) {
      html += '<p class="muted">错词库是空的。默写错的词会自动进来，也可以手动添加。</p>';
    } else {
      html += '<p class="muted">这一项下面还没有错词。</p>';
    }
  }
  ww.forEach(function (x) {
    html += '<div class="dict-row"><b>' + esc(x.word) + '</b> <span style="color:var(--accent)">' + esc(x.pos || "") + "</span> " + esc(x.meaning || "") + (x.wrongSpelling ? ' <span class="muted">（你写成：' + esc(x.wrongSpelling) + "）</span>" : "") + (x.source ? ' <span class="badge src">' + esc(x.source) + "</span>" : "") + (x.mastered ? ' <span class="done-mark">已掌握</span>' : "");
    html += '<div><button class="btn ghost small" onclick="setWrongMastered(\'' + x.id + "'," + (!x.mastered) + ');renderWords()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteWrongWord(\'' + x.id + '\');renderWords()">删除</button></div></div>';
  });
  html += "</div>";
  $("view-words").innerHTML = html;
}
function playDayWords(day) {
  var days = window.ENG_WORD_DAYS || [];
  var d = null;
  days.forEach(function (x) { if (x.day === day) d = x; });
  if (!d) return;
  stopSpeak();
  var words = (d.words || []).map(function (w) { return w.w; });
  var i = 0;
  function next() {
    if (i >= words.length) return;
    speakText(words[i] + ". " + words[i] + ".", 0.7, function () { i++; next(); });
  }
  next();
}
function checkDict(day, i, word, pos, meaning) {
  var inp = $("dict-" + i);
  var v = inp ? inp.value.trim() : "";
  var ok = v.toLowerCase() === word.toLowerCase();
  dictState[day + "-" + i] = { status: ok ? "ok" : "wrong", input: v };
  if (!ok) addWrongWord(word, pos, meaning, v, day, "");
  renderWords();
}
function skipDict(day, i, word, pos, meaning) {
  dictState[day + "-" + i] = { status: "wrong", input: "" };
  addWrongWord(word, pos, meaning, "", day, "");
  renderWords();
}
function checkPhraseDict(day, i, phrase, meaning) {
  var inp = $("pdict-" + i);
  var v = inp ? inp.value.trim() : "";
  var ok = v.toLowerCase().replace(/\s+/g, " ") === phrase.toLowerCase().replace(/\s+/g, " ");
  phraseDictState[day + "-" + i] = { status: ok ? "ok" : "wrong", input: v };
  if (!ok) addWrongWord(phrase, "词组", meaning, v, null, "来自词组与短语默写");
  renderWords();
}
function skipPhraseDict(day, i, phrase, meaning) {
  phraseDictState[day + "-" + i] = { status: "wrong", input: "" };
  addWrongWord(phrase, "词组", meaning, "", null, "来自词组与短语默写");
  renderWords();
}
function manualAddWrong() {
  var w = $("ww-word").value.trim();
  var p = $("ww-pos").value.trim();
  var m = $("ww-mean").value.trim();
  if (!w || !p || !m) { alert("单词、词性、中文三项都要填。"); return; }
  addWrongWord(w, p, m, "", null, "手动添加");
  renderWords();
}
</script>

<script>
/* ============ 听力 ============ */
var L_VERSIONS = [
  { id: "basic", name: "基础版" },
  { id: "advanced", name: "进阶版" },
  { id: "exam", name: "四级真题版" }
];
var L_TYPES = [
  { id: "dialogue", name: "短对话" },
  { id: "news", name: "短篇新闻" },
  { id: "passage", name: "听力篇章" }
];
var N_VERSIONS = [
  { id: "basic", name: "基础版" },
  { id: "advanced", name: "进阶版" },
  { id: "real", name: "四级真题版" }
];
var P_VERSIONS = N_VERSIONS;
var curLType = "dialogue";
var curLVersion = "basic";
var curNVersion = "basic";
var curPVersion = "basic";
var curLEpisode = null; /* episode no */
var lAnswers = {}; /* itemIdx -> selected letter */
var lChecked = false;

function listeningData(version) {
  if (version === "basic") return window.ENG_LISTENING_BASIC || [];
  if (version === "advanced") return window.ENG_LISTENING_ADVANCED || [];
  return window.ENG_LISTENING_EXAM || [];
}
function listeningEpisode(version, no) {
  var eps = listeningData(version);
  for (var i = 0; i < eps.length; i++) { if (eps[i].no === no) return eps[i]; }
  return null;
}
function newsData(version) {
  if (version === "basic") return window.ENG_NEWS_BASIC || [];
  if (version === "advanced") return window.ENG_NEWS_ADVANCED || [];
  return window.ENG_NEWS_REAL || [];
}
function passageData(version) {
  if (version === "basic") return window.ENG_PASSAGE_BASIC || [];
  if (version === "advanced") return window.ENG_PASSAGE_ADVANCED || [];
  return window.ENG_PASSAGE_REAL || [];
}
function newsEpisode(version, no) {
  var eps = newsData(version);
  for (var i = 0; i < eps.length; i++) { if (eps[i].no === no) return eps[i]; }
  return null;
}
function passageEpisode(version, no) {
  var eps = passageData(version);
  for (var i = 0; i < eps.length; i++) { if (eps[i].no === no) return eps[i]; }
  return null;
}
function curLTypeData() {
  if (curLType === "news") return newsData(curNVersion);
  if (curLType === "passage") return passageData(curPVersion);
  return listeningData(curLVersion);
}
function curLTypeVersion() {
  if (curLType === "news") return curNVersion;
  if (curLType === "passage") return curPVersion;
  return curLVersion;
}
function curLTypeVersions() {
  if (curLType === "news") return N_VERSIONS;
  if (curLType === "passage") return P_VERSIONS;
  return L_VERSIONS;
}
function curLTypeName() {
  var t = L_TYPES.filter(function (x) { return x.id === curLType; })[0];
  return t ? t.name : "短对话";
}
function curLTypeVersionName() {
  var vs = curLTypeVersions();
  var v = vs.filter(function (x) { return x.id === curLTypeVersion(); })[0];
  return v ? v.name : "";
}
function curLTypeEdition() {
  if (curLType === "news") return "news-" + curNVersion;
  if (curLType === "passage") return "passage-" + curPVersion;
  return curLVersion;
}
function curLTypeEpisode() {
  if (curLType === "news") return newsEpisode(curNVersion, curLEpisode);
  if (curLType === "passage") return passageEpisode(curPVersion, curLEpisode);
  return listeningEpisode(curLVersion, curLEpisode);
}

/* 听力播放器：把对话按句切分，逐句朗读（speechSynthesis），支持倍速、按句前进/后退、点进度条跳转 */
var LP = { segs: [], idx: 0, playing: false, rate: 1, timer: null };
function lpSplit(script) {
  var segs = [];
  String(script || "").split("\n").forEach(function (line) {
    line = line.trim();
    if (!line) return;
    var m = line.match(/^([WM])[:：]\s*(.*)$/);
    var sp = m ? m[1] : "";
    var txt = m ? m[2] : line;
    txt.split(/(?<=[.?!])\s+/).forEach(function (s) {
      s = s.trim();
      if (s) segs.push({ sp: sp, text: s });
    });
  });
  return segs;
}
function lpSpeakFrom(idx) {
  if (!synth) return;
  synth.cancel();
  LP.idx = idx;
  if (LP.idx >= LP.segs.length) { LP.playing = false; lpRenderProgress(); return; }
  LP.playing = true;
  var seg = LP.segs[LP.idx];
  var u = new SpeechSynthesisUtterance(seg.text);
  var v = pickVoice();
  if (v) u.voice = v;
  u.lang = "en-US";
  u.rate = LP.rate;
  u.onend = function () { LP.idx++; lpRenderProgress(); if (LP.playing) lpSpeakFrom(LP.idx); };
  u.onerror = function () { LP.idx++; lpRenderProgress(); if (LP.playing) lpSpeakFrom(LP.idx); };
  synth.speak(u);
  lpRenderProgress();
}
function lpRenderProgress() {
  var bar = $("lp-fill");
  var lab = $("lp-label");
  if (bar) bar.style.width = (LP.segs.length ? Math.round(LP.idx / LP.segs.length * 100) : 0) + "%";
  if (lab) lab.textContent = LP.segs.length ? ("第 " + Math.min(LP.idx + 1, LP.segs.length) + " / " + LP.segs.length + " 句") : "";
  var btn = $("lp-play");
  if (btn) btn.textContent = LP.playing ? "暂停" : "播放";
}
function lpPlayPause() {
  if (!LP.segs.length) return;
  if (LP.playing) { if (synth) synth.pause(); LP.playing = false; lpRenderProgress(); }
  else {
    if (synth && synth.paused) { synth.resume(); LP.playing = true; lpRenderProgress(); }
    else lpSpeakFrom(LP.idx >= LP.segs.length ? 0 : LP.idx);
  }
}
function lpStop() { if (synth) synth.cancel(); LP.playing = false; LP.idx = 0; lpRenderProgress(); }
function lpJump(delta) {
  var ni = Math.max(0, Math.min(LP.segs.length - 1, LP.idx + delta));
  if (LP.playing) lpSpeakFrom(ni);
  else { LP.idx = ni; lpRenderProgress(); }
}
function lpSeek(frac) {
  var ni = Math.floor(frac * LP.segs.length);
  ni = Math.max(0, Math.min(LP.segs.length - 1, ni));
  if (LP.playing) lpSpeakFrom(ni);
  else { LP.idx = ni; lpRenderProgress(); }
}

  });
}
function listeningWordsEpisodeHTML(edition, episode) {

  html += '<button class="btn small" onclick="lwAutoFill(\'' + edition + "'," + episode + ')">查词性+中文</button> ';
  html += '<button class="btn small" onclick="lwAdd(\'' + edition + "'," + episode + ')">记入本期生词</button>';

    html += '<div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(x.word).replace(/'/g, "\\'") + '\')">读音</button><button class="btn ghost small" onclick="setLWordMastered(\'' + x.id + "'," + (!x.mastered) + ');renderPractice()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteLWord(\'' + x.id + '\');renderPractice()">删除</button></div></div>';
  });

function lwAutoFill(edition, episode) {
  var w = $("lw-input").value.trim();
  if (!w) { alert("先输入英文单词。"); return; }
  var hit = lookupLocal(w);
  if (hit) {
    $("lw-pos").value = hit.pos || "";
    $("lw-mean").value = hit.meaning || "";
  } else {
    alert("本地词典里没有这个词，请自己填词性和中文。");
  }
}
function lwAdd(edition, episode) {
  var w = $("lw-input").value.trim();
  var p = $("lw-pos").value.trim();
  var m = $("lw-mean").value.trim();
  if (!w) { alert("先输入英文单词。"); return; }
  if (!p || !m) {
    var hit = lookupLocal(w);
    if (hit) { p = p || hit.pos || ""; m = m || hit.meaning || ""; }
  }
  if (!p || !m) { alert("词性和中文都要填（可以点“查词性+中文”自动填，查不到就自己填）。"); return; }
  addListeningWord(edition, episode, w, p, m);
  renderPractice();
}

  if (!words.length) html += "<p class=\"muted\">这一期还没有记生词。</p>";

    html += '<div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(x.word).replace(/'/g, "\\'") + '\')">读音</button><button class="btn ghost small" onclick="setLWordMastered(\'' + x.id + "'," + (!x.mastered) + ');renderPractice()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteLWord(\'' + x.id + '\');renderPractice()">删除</button></div></div>';
  });
  html += "</div>";
  return html;
}

<script>
/* ============ 阅读 ============ */
var R_VERSIONS = [
  { id: "basic", name: "基础版" },
  { id: "advanced", name: "进阶版" },
  { id: "exam", name: "四级真题版" }
];
var curRVersion = "basic";
var curREpisode = null;
var rAnswers = {}; /* "p0-2" -> letter */
var rShowAnswers = false;

function readingData(version) {
  if (version === "basic") return window.ENG_READING_BASIC || [];
  if (version === "advanced") return window.ENG_READING_ADVANCED || [];
  return window.ENG_READING_EXAM || [];
}
function readingEpisode(version, no) {
  var eps = readingData(version);
  for (var i = 0; i < eps.length; i++) { if (eps[i].no === no) return eps[i]; }
  return null;
}

function renderReadingHome() {
  var html = '<div class="chips">';
  R_VERSIONS.forEach(function (v) {
    html += '<button class="' + (v.id === curRVersion ? "active" : "") + '" onclick="curRVersion=\'' + v.id + '\';curREpisode=null;rShowAnswers=false;rAnswers={};renderPractice()">' + esc(v.name) + "</button>";
  });
  html += "</div>";
  var eps = readingData(curRVersion);
  html += '<div class="card"><h2>' + esc(R_VERSIONS.filter(function (v) { return v.id === curRVersion; })[0].name) + " · 共 " + eps.length + " 期（" + eps.length * 2 + ' 篇）</h2><p class="muted">每期 2 篇文章，每篇 5 道题。文章里的单词点一下就能查读音、词性和中文意思。</p></div>';
  html += '<div class="card"><div class="ep-list">';
  eps.forEach(function (ep) {
    html += '<div class="ep-item" onclick="curREpisode=' + ep.no + ';rShowAnswers=false;rAnswers={};renderPractice()"><span>第' + ep.no + "期</span><span class=\"muted\">2 篇 · 10 题 ›</span></div>";
  });
  html += "</div></div>";
  html += readingWordsHomeHTML();
  return html;
}

/* 文章逐词可点：单词是正常文字，只留虚线下划线，绝不包方框；标记笔模式下点词改为涂标记 */
function tappableHTML(text, edition, episode, pi) {
  var marks = getEpisodeMarks(edition, episode);
  var pmarks = marks[String(pi)] || {};
  var parts = String(text || "").split("\n");
  var out = "";
  parts.forEach(function (para, paraIdx) {
    if (!para.trim()) return;
    out += '<p class="passage">';
    var re = /[A-Za-z]+(?:'[A-Za-z]+)?|[0-9]+(?:[.,][0-9]+)?|[^A-Za-z0-9\s]+|\s+/g;
    var m;
    var wIdx = 0;
    while ((m = re.exec(para)) !== null) {
      var tok = m[0];
      if (/^[A-Za-z]/.test(tok)) {
        var key = paraIdx + ":" + wIdx;
        var mk = pmarks[key] || "";
        var cls = "tap-word" + (mk === "hl" ? " mark-hl" : mk === "ul" ? " mark-ul" : "");
        out += '<span class="' + cls + '" onclick="tapWordOrMark(\'' + tok.replace(/'/g, "\\'") + "','" + edition + "'," + episode + "," + pi + "," + paraIdx + "," + wIdx + ')">' + esc(tok) + "</span>";
        wIdx++;
      } else {
        out += esc(tok);
      }
    }
    out += "</p>";
  });
  return out;
}
/* 标记笔模式：lookup 点词查词；hl 荧光笔；ul 下划线笔；eraser 橡皮。两种标记互斥，再点一次取消 */
var penMode = "lookup";
function tapWordOrMark(word, edition, episode, pi, paraIdx, wIdx) {
  if (penMode === "lookup") { tapWord(word, edition, episode); return; }
  var marks = getEpisodeMarks(edition, episode);
  var pkey = String(pi);
  if (!marks[pkey]) marks[pkey] = {};
  var key = paraIdx + ":" + wIdx;
  if (penMode === "eraser") {
    delete marks[pkey][key];
  } else {
    var kind = penMode === "hl" ? "hl" : "ul";
    if (marks[pkey][key] === kind) delete marks[pkey][key];
    else marks[pkey][key] = kind;
  }
  if (Object.keys(marks[pkey]).length === 0) delete marks[pkey];
  setEpisodeMarks(edition, episode, marks);
  rerenderKeepScroll();
}
function setPenMode(mode) {
  penMode = mode;
  renderPractice();
}
function clearAllMarks(edition, episode) {
  setEpisodeMarks(edition, episode, {});
  rerenderKeepScroll();
}
function rerenderKeepScroll() {
  var y = 0;
  try { y = window.scrollY || document.documentElement.scrollTop || 0; } catch (e) {}
  renderPractice();
  try { if (typeof window.scrollTo === "function") window.scrollTo(0, y); } catch (e) {}
}
/* 牛津式单词卡：音标、词性、本意、延伸义、例句；查不到时只给读音+有道外链，不再弹手动填表 */
function wordCardHTML(word, hit, addBtn) {
  var html = '<h2>' + esc(word) + "</h2>";
  if (hit) {
    html += '<p><span class="muted">' + esc(hit.phon || "") + '</span></p><p><b>' + esc(hit.pos || "") + '</b> ' + esc(hit.meaning || "") + "</p>";
    if (hit.extended && hit.extended.length) {
      html += '<p><b>延伸义：</b>' + esc(hit.extended.join("；")) + "</p>";
    }
    (hit.examples || []).slice(0, 2).forEach(function (x) {
      html += '<p>' + esc(x.en || "") + (x.zh ? '<br><span class="muted">' + esc(x.zh) + "</span>" : "") + "</p>";
    });
    html += '<input type="hidden" id="tw-pos" value="' + esc(hit.pos || "") + '"><input type="hidden" id="tw-mean" value="' + esc(hit.meaning || "") + '">';
  } else {
    html += '<p class="muted">本地词典里没有这个词。</p>';
    html += '<p><a href="https://www.youdao.com/result?word=' + encodeURIComponent(word) + '&lang=en" target="_blank" rel="noopener">去有道查词 ›</a></p>';
  }
  html += '<div style="margin-top:10px"><button class="btn" onclick="speakWordTwice(\'' + esc(word).replace(/'/g, "\\'") + '\')">读音</button> ';
  if (hit && addBtn) html += addBtn + " ";
  html += '<button class="btn ghost" onclick="closeModal()">关闭</button></div>';
  return html;
}
function tapWord(word, edition, episode, addTo) {
  var hit = lookupLocal(word);
  var addBtn = "";
  if (addTo === "listening") {
    addBtn = '<button class="btn" onclick="addListeningWordFromTap(\'' + edition + "'," + episode + ",'" + esc(word).replace(/'/g, "\\'") + '\')">记入本期生词</button>';
  } else if (addTo !== "none") {
    addBtn = '<button class="btn" onclick="addReadingWordFromTap(\'' + edition + "'," + episode + ",'" + esc(word).replace(/'/g, "\\'") + '\')">记入本期生词</button>';
  }
  openModal(wordCardHTML(word, hit, addBtn));
}
function addListeningWordFromTap(edition, episode, word) {
  var p = $("tw-pos") ? $("tw-pos").value.trim() : "";
  var m = $("tw-mean") ? $("tw-mean").value.trim() : "";
  if (!p || !m) { alert("词性和中文都要填。"); return; }
  addListeningWord(edition, episode, word, p, m);
  closeModal();
  renderPractice();
}
/* 点词查词（无标记笔）：翻译参考译文、写作范文、听力原文里的单词都能点；addTo 为 listening 时记入听力生词，none 时只查词 */
function tappableText(text, edition, episode, addTo) {
  var out = "";
  String(text || "").split("\n").forEach(function (para) {
    if (!para.trim()) return;
    out += '<p class="passage">';
    var re = /[A-Za-z]+(?:'[A-Za-z]+)?|[0-9]+(?:[.,][0-9]+)?|[^A-Za-z0-9\s]+|\s+/g;
    var m;
    while ((m = re.exec(para)) !== null) {
      var tok = m[0];
      if (/^[A-Za-z]/.test(tok)) {
        out += '<span class="tap-word" onclick="tapWord(\'' + tok.replace(/'/g, "\\'") + "','" + edition + "'," + episode + ",'" + (addTo || "none") + '\')">' + esc(tok) + "</span>";
      } else {
        out += esc(tok);
      }
    }
    out += "</p>";
  });
  return out;
}
function addReadingWordFromTap(edition, episode, word) {
  var p = $("tw-pos") ? $("tw-pos").value.trim() : "";
  var m = $("tw-mean") ? $("tw-mean").value.trim() : "";
  if (!p || !m) { alert("词性和中文都要填。"); return; }
  addReadingWord(edition, episode, word, p, m);
  closeModal();
  renderPractice();
}

function renderReadingEpisode() {
  var ep = readingEpisode(curRVersion, curREpisode);
  if (!ep) return renderReadingHome();
  var vname = R_VERSIONS.filter(function (v) { return v.id === curRVersion; })[0].name;
  var html = '<button class="btn ghost" onclick="curREpisode=null;rShowAnswers=false;renderPractice()">‹ 返回' + esc(vname) + '列表</button>';
  var markCount = countEpisodeMarks(curRVersion, ep.no);
  html += '<div class="pen-toolbar"><span class="lbl">标记笔：</span>';
  html += '<button class="' + (penMode === "lookup" ? "active" : "") + '" onclick="setPenMode(\'lookup\')">点词查词</button>';
  html += '<button class="' + (penMode === "hl" ? "active" : "") + '" onclick="setPenMode(\'hl\')">荧光笔</button>';
  html += '<button class="' + (penMode === "ul" ? "active" : "") + '" onclick="setPenMode(\'ul\')">下划线笔</button>';
  html += '<button class="' + (penMode === "eraser" ? "active" : "") + '" onclick="setPenMode(\'eraser\')">橡皮</button>';
  html += '<button onclick="clearAllMarks(\'' + curRVersion + "'," + ep.no + ')" ' + (markCount ? "" : "disabled") + ">清除全部标记（" + markCount + "）</button>";
  html += "</div>";
  html += '<div class="card"><h2>' + esc(vname) + " 第" + ep.no + "期</h2>";
  ep.passages.forEach(function (ps, pi) {
    html += '<h3>第' + (pi + 1) + "篇 · " + esc(ps.title) + "</h3>";
    html += tappableHTML(ps.text, curRVersion, ep.no, pi);
    html += "<h3>题目</h3>";
    ps.questions.forEach(function (q, qi) {
      var key = pi + "-" + qi;
      html += "<p><b>" + (qi + 1) + ". </b>" + esc(q.prompt) + "</p>";
      q.options.forEach(function (op, oi) {
        var letter = "ABCD"[oi];
        var cls = "opt";
        if (rAnswers[key] === letter) cls += " sel";
        if (rShowAnswers) {
          if (letter === q.answer) cls += " right";
          else if (rAnswers[key] === letter) cls += " wrong";
        }
        html += '<button class="' + cls + '" onclick="if(!rShowAnswers){rAnswers[\'' + key + "']='" + letter + '\';renderPractice()}">' + letter + ". " + esc(op) + "</button>";
      });
    });
  });
  html += '<div style="margin-top:14px"><button class="btn" onclick="rShowAnswers=true;renderPractice()" ' + (rShowAnswers ? "disabled" : "") + '>点开查看本期答案与解析</button></div>';
  if (rShowAnswers) {
    var total = 0, right = 0;
    html += '<div class="answer-box open"><h3>本期答案与解析</h3>';
    ep.passages.forEach(function (ps, pi) {
      html += "<h3>第" + (pi + 1) + "篇 · " + esc(ps.title) + "</h3>";
      ps.questions.forEach(function (q, qi) {
        var key = pi + "-" + qi;
        var mine = rAnswers[key] || "未作答";
        total++;
        if (mine === q.answer) right++;
        html += "<p><b>第" + (qi + 1) + "题：正确答案为 " + esc(q.answer) + "</b></p><p>" + esc(q.analysis || "") + "</p>";
        html += mine === q.answer ? '<p class="done-mark">你答对了</p>' : '<p style="color:var(--red)">你答错了（你选 ' + esc(mine) + "，正确答案 " + esc(q.answer) + "）</p>";
        if (mine !== q.answer) {
          html += '<button class="btn ghost small" onclick="addMistakeFromReading(\'' + curRVersion + "'," + ep.no + "," + pi + "," + qi + ')">加入错题库</button>';
        }
      });
    });
    html += '<p class="muted">本期答对 ' + right + " / " + total + " 题</p></div>";
  }
  html += "</div>";
  html += readingWordsEpisodeHTML(curRVersion, ep.no);
  return html;
}
function addMistakeFromReading(version, epNo, pi, qi) {
  var ep = readingEpisode(version, epNo);
  if (!ep) return;
  var ps = ep.passages[pi];
  var q = ps.questions[qi];
  var key = pi + "-" + qi;
  var mine = rAnswers[key] || "未作答";
  var myText = "";
  if (mine && "ABCD".indexOf(mine) >= 0) myText = q.options["ABCD".indexOf(mine)];
  openMistakeForm({
    module: "reading",
    title: "阅读 第" + epNo + "期 第" + (pi + 1) + "篇 第" + (qi + 1) + "题",
    question: "《" + ps.title + "》\n" + q.prompt + "\n" + q.options.map(function (o, i) { return "ABCD"[i] + ". " + o; }).join("\n"),
    myAnswer: mine + ". " + myText,
    correctAnswer: q.answer + ". " + q.options["ABCD".indexOf(q.answer)]
  });
}
function readingWordsEpisodeHTML(edition, episode) {
  var words = getReadingWords().filter(function (x) { return x.edition === edition && x.episode === episode; });
  var html = '<div class="card"><h2>本期生词汇总</h2><p class="muted">点文章里的单词可以直接记入，也可以手动输入英文单词。</p>';
  html += '<input type="text" id="rw-input" placeholder="输入英文单词">';
  html += '<input type="text" id="rw-pos" placeholder="词性"><input type="text" id="rw-mean" placeholder="中文意思">';
  html += '<button class="btn small" onclick="rwAutoFill()">查词性+中文</button> ';
  html += '<button class="btn small" onclick="rwAdd(\'' + edition + "'," + episode + ')">记入本期生词</button>';
  if (!words.length) html += '<p class="muted">本期还没有记生词。</p>';
  words.forEach(function (x) {
    html += '<div class="dict-row"><b>' + esc(x.word) + '</b> <span style="color:var(--accent)">' + esc(x.pos || "") + "</span> " + esc(x.meaning || "") + (x.mastered ? ' <span class="done-mark">已掌握</span>' : "");
    html += '<div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(x.word).replace(/'/g, "\\'") + '\')">读音</button><button class="btn ghost small" onclick="setRWordMastered(\'' + x.id + "'," + (!x.mastered) + ');renderPractice()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteRWord(\'' + x.id + '\');renderPractice()">删除</button></div></div>';
  });
  html += "</div>";
  return html;
}
function rwAutoFill() {
  var w = $("rw-input").value.trim();
  if (!w) { alert("先输入英文单词。"); return; }
  var hit = lookupLocal(w);
  if (hit) { $("rw-pos").value = hit.pos || ""; $("rw-mean").value = hit.meaning || ""; }
  else alert("本地词典里没有这个词，请自己填词性和中文。");
}
function rwAdd(edition, episode) {
  var w = $("rw-input").value.trim();
  var p = $("rw-pos").value.trim();
  var m = $("rw-mean").value.trim();
  if (!w) { alert("先输入英文单词。"); return; }
  if (!p || !m) { var hit = lookupLocal(w); if (hit) { p = p || hit.pos || ""; m = m || hit.meaning || ""; } }
  if (!p || !m) { alert("词性和中文都要填（可以点“查词性+中文”自动填，查不到就自己填）。"); return; }
  addReadingWord(edition, episode, w, p, m);
  renderPractice();
}
function readingWordsHomeHTML() {
  var all = getReadingWords();
  var html = '<div class="card"><h2>生词汇总</h2><p class="muted">选一期，看那期记下的全部生词。</p>';
  html += '<select id="rw-home-sel" onchange="window.__rwHomeEp=this.value;renderPractice()">';
  R_VERSIONS.forEach(function (v) {
    for (var n = 1; n <= 50; n++) {
      var sel = (window.__rwHomeEp === v.id + "-" + n) ? " selected" : "";
      html += '<option value="' + v.id + "-" + n + '"' + sel + ">" + esc(v.name) + " 第" + n + "期</option>";
    }
  });
  html += "</select>";
  var selVal = window.__rwHomeEp || (curRVersion + "-1");
  var parts = selVal.split("-");
  var ed = parts[0], epNo = +parts[1];
  var words = all.filter(function (x) { return x.edition === ed && x.episode === epNo; });
  if (!words.length) html += "<p class=\"muted\">这一期还没有记生词。</p>";
  words.forEach(function (x) {
    html += '<div class="dict-row"><b>' + esc(x.word) + '</b> <span style="color:var(--accent)">' + esc(x.pos || "") + "</span> " + esc(x.meaning || "") + (x.mastered ? ' <span class="done-mark">已掌握</span>' : "");
    html += '<div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(x.word).replace(/'/g, "\\'") + '\')">读音</button><button class="btn ghost small" onclick="setRWordMastered(\'' + x.id + "'," + (!x.mastered) + ');renderPractice()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteRWord(\'' + x.id + '\');renderPractice()">删除</button></div></div>';
  });
  html += "</div>";
  return html;
}
</script>

<script>
/* ============ 选词填空 ============ */
var C_VERSIONS = [
  { id: "basic", name: "基础版" },
  { id: "advanced", name: "进阶版" },
  { id: "exam", name: "四级真题版" }
];
var curCVersion = "basic";
var curClozeEpisode = null; /* episode no */
var cFills = {}; /* blankIdx 0-9 -> bank letter A-O */
var cShowAnswers = false;
var curClozeBlank = 0; /* 当前选中的空 0-9 */
var cPage = 1;
var C_PAGE_SIZE = 10;

function clozeData(version) {
  if (version === "basic") return window.ENG_CLOZE_BASIC || [];
  if (version === "advanced") return window.ENG_CLOZE_ADVANCED || [];
  return window.ENG_CLOZE_REAL || [];
}
function clozeEpisode(version, no) {
  var eps = clozeData(version);
  for (var i = 0; i < eps.length; i++) { if (eps[i].no === no) return eps[i]; }
  return null;
}
function clozeVersionName(id) {
  for (var i = 0; i < C_VERSIONS.length; i++) { if (C_VERSIONS[i].id === id) return C_VERSIONS[i].name; }
  return id;
}
function clozeBankLetter(i) { return "ABCDEFGHIJKLMNO"[i]; }

function renderClozeHome() {
  var html = '<div class="chips">';
  C_VERSIONS.forEach(function (v) {
    html += '<button class="' + (v.id === curCVersion ? "active" : "") + '" onclick="curCVersion=\'' + v.id + '\';curClozeEpisode=null;cShowAnswers=false;cFills={};curClozeBlank=0;cPage=1;renderPractice()">' + esc(v.name) + "</button>";
  });
  html += "</div>";
  var eps = clozeData(curCVersion);
  var intro = curCVersion === "exam"
    ? "往年四级选词填空真题，每篇标明年份和套数，原文、词库和答案逐篇核对过出处。"
    : "按四级选词填空标准自编的模拟题，明确标注为自编模拟题，不是真题。每篇 10 个空、词库 15 个词。";
  html += '<div class="card"><h2>' + esc(clozeVersionName(curCVersion)) + " · 共 " + eps.length + ' 篇</h2><p class="muted">' + esc(intro) + "</p></div>";
  var total = eps.length;
  var pages = Math.max(1, Math.ceil(total / C_PAGE_SIZE));
  if (cPage > pages) cPage = pages;
  var start = (cPage - 1) * C_PAGE_SIZE;
  var pageItems = eps.slice(start, start + C_PAGE_SIZE);
  html += '<div class="card"><div class="ep-list">';
  pageItems.forEach(function (ep) {
    var label = "第" + ep.no + "篇 · " + ep.title + (ep.source ? "（" + ep.source + "）" : "");
    html += '<div class="ep-item" onclick="curClozeEpisode=' + ep.no + ';cShowAnswers=false;cFills={};curClozeBlank=0;renderPractice()"><span>' + esc(label) + '</span><span class="muted">10 空 ›</span></div>';
  });
  html += "</div>";
  if (pages > 1) {
    html += '<div style="margin-top:10px"><button class="btn ghost small" onclick="cPage=Math.max(1,cPage-1);renderPractice()" ' + (cPage <= 1 ? "disabled" : "") + ">上一页</button> ";
    html += '<span class="muted">第 ' + cPage + " / " + pages + " 页</span> ";
    html += '<button class="btn ghost small" onclick="cPage=Math.min(' + pages + ',cPage+1);renderPractice()" ' + (cPage >= pages ? "disabled" : "") + ">下一页</button></div>";
  }
  html += "</div>";
  html += clozeWordsHomeHTML();
  return html;
}

/* 选词填空文章渲染：单词是正常文字、只留虚线下划线（复用 tap-word 样式，绝不包方框）；{{26}}…{{35}} 渲染为空位按钮 */
function clozePassageHTML(text, edition, episode) {
  var marks = getClozeEpisodeMarks(edition, episode);
  var pmarks = marks["0"] || {};
  var parts = String(text || "").split("\n");
  var out = "";
  parts.forEach(function (para, paraIdx) {
    if (!para.trim()) return;
    out += '<p class="passage">';
    var re = /\{\{(\d+)\}\}|[A-Za-z]+(?:'[A-Za-z]+)?|[0-9]+(?:[.,][0-9]+)?|[^A-Za-z0-9\s{}]+|\s+/g;
    var m;
    var wIdx = 0;
    while ((m = re.exec(para)) !== null) {
      var tok = m[0];
      if (m[1]) {
        var num = +m[1];
        var bi = num - 26;
        var letter = cFills[String(bi)];
        var cls = "cloze-blank";
        if (bi === curClozeBlank) cls += " sel";
        if (letter) cls += " filled";
        if (cShowAnswers) {
          var ep = clozeEpisode(edition, episode);
          var rightLetter = ep && ep.blanks[bi] ? ep.blanks[bi].answer : "";
          cls += (letter === rightLetter) ? " right" : " wrong";
        }
        var label = letter ? esc(letter) : String(num);
        out += '<button class="' + cls + '" onclick="curClozeBlank=' + bi + ';renderPractice()">' + label + "</button>";
      } else if (/^[A-Za-z]/.test(tok)) {
        var key = paraIdx + ":" + wIdx;
        var mk = pmarks[key] || "";
        var wcls = "tap-word" + (mk === "hl" ? " mark-hl" : mk === "ul" ? " mark-ul" : "");
        out += '<span class="' + wcls + '" onclick="tapWordOrMarkCloze(\'' + tok.replace(/'/g, "\\'") + "','" + edition + "'," + episode + "," + paraIdx + "," + wIdx + ')">' + esc(tok) + "</span>";
        wIdx++;
      } else {
        out += esc(tok);
      }
    }
    out += "</p>";
  });
  return out;
}
function tapWordOrMarkCloze(word, edition, episode, paraIdx, wIdx) {
  if (penMode === "lookup") { tapWordCloze(word, edition, episode); return; }
  var marks = getClozeEpisodeMarks(edition, episode);
  if (!marks["0"]) marks["0"] = {};
  var key = paraIdx + ":" + wIdx;
  if (penMode === "eraser") {
    delete marks["0"][key];
  } else {
    var kind = penMode === "hl" ? "hl" : "ul";
    if (marks["0"][key] === kind) delete marks["0"][key];
    else marks["0"][key] = kind;
  }
  if (Object.keys(marks["0"]).length === 0) delete marks["0"];
  setClozeEpisodeMarks(edition, episode, marks);
  rerenderKeepScroll();
}
function clearAllClozeMarks(edition, episode) {
  setClozeEpisodeMarks(edition, episode, {});
  rerenderKeepScroll();
}
function tapWordCloze(word, edition, episode) {
  var hit = lookupLocal(word);
  var addBtn = '<button class="btn" onclick="addClozeWordFromTap(\'' + edition + "'," + episode + ",'" + esc(word).replace(/'/g, "\\'") + '\')">记入本期生词</button>';
  openModal(wordCardHTML(word, hit, addBtn));
}
function addClozeWordFromTap(edition, episode, word) {
  var p = $("tw-pos") ? $("tw-pos").value.trim() : "";
  var m = $("tw-mean") ? $("tw-mean").value.trim() : "";
  if (!p || !m) { alert("词性和中文都要填。"); return; }
  addClozeWord(edition, episode, word, p, m);
  closeModal();
  renderPractice();
}

function renderClozeEpisode() {
  var ep = clozeEpisode(curCVersion, curClozeEpisode);
  if (!ep) return renderClozeHome();
  var vname = clozeVersionName(curCVersion);
  var html = '<button class="btn ghost" onclick="curClozeEpisode=null;cShowAnswers=false;renderPractice()">‹ 返回' + esc(vname) + '列表</button>';
  var markCount = countClozeMarks(curCVersion, ep.no);
  html += '<div class="pen-toolbar"><span class="lbl">标记笔：</span>';
  html += '<button class="' + (penMode === "lookup" ? "active" : "") + '" onclick="setPenMode(\'lookup\')">点词查词</button>';
  html += '<button class="' + (penMode === "hl" ? "active" : "") + '" onclick="setPenMode(\'hl\')">荧光笔</button>';
  html += '<button class="' + (penMode === "ul" ? "active" : "") + '" onclick="setPenMode(\'ul\')">下划线笔</button>';
  html += '<button class="' + (penMode === "eraser" ? "active" : "") + '" onclick="setPenMode(\'eraser\')">橡皮</button>';
  html += '<button onclick="clearAllClozeMarks(\'' + curCVersion + "'," + ep.no + ')" ' + (markCount ? "" : "disabled") + ">清除全部标记（" + markCount + "）</button>";
  html += "</div>";
  html += '<div class="card"><h2>' + esc(vname) + " 第" + ep.no + "篇" + (ep.source ? " · " + esc(ep.source) : "") + "</h2>";
  html += "<h3>" + esc(ep.title) + "</h3>";
  html += '<p class="muted">点一个空（26–35），再点下方词库里的词填进去；每个词只能用一次，已用的词点一下可以移到当前选中的空。</p>';
  html += clozePassageHTML(ep.text, curCVersion, ep.no);
  html += "<h3>词库（A–O）</h3>";
  html += '<div class="bank-grid">';
  (ep.bank || []).forEach(function (w, i) {
    var letter = clozeBankLetter(i);
    var used = false;
    Object.keys(cFills).forEach(function (k) { if (cFills[k] === letter) used = true; });
    html += '<button class="bank-word' + (used ? " used" : "") + '" onclick="fillClozeBlank(\'' + letter + '\')" ' + (cShowAnswers ? "disabled" : "") + ">" + letter + ". " + esc(w) + "</button>";
  });
  html += "</div>";
  html += '<div><button class="btn ghost small" onclick="clearClozeBlank();renderPractice()" ' + (cShowAnswers || !cFills[String(curClozeBlank)] ? "disabled" : "") + ">清除当前空（第 " + (curClozeBlank + 26) + " 空）</button></div>";
  html += '<div style="margin-top:12px"><button class="btn" onclick="cShowAnswers=true;renderPractice()" ' + (cShowAnswers ? "disabled" : "") + '>自查</button></div>';
  if (cShowAnswers) {
    var right = 0, total = 0;
    html += '<div class="answer-box open"><h3>本篇答案与解析</h3>';
    (ep.blanks || []).forEach(function (b, i) {
      var mine = cFills[String(i)] || "未作答";
      total++;
      if (mine === b.answer) right++;
      var mineWord = "";
      if (mine && "ABCDEFGHIJKLMNO".indexOf(mine) >= 0) mineWord = ep.bank["ABCDEFGHIJKLMNO".indexOf(mine)];
      html += "<p><b>第" + (26 + i) + "空：正确答案为 " + esc(b.answer) + "（" + esc(b.word) + "，" + esc(b.pos || "") + "）</b></p><p>" + esc(b.analysis || "") + "</p>";
      html += mine === b.answer ? '<p class="done-mark">你答对了</p>' : '<p style="color:var(--red)">你答错了（你选 ' + esc(mine) + (mineWord ? ". " + esc(mineWord) : "") + "，正确答案 " + esc(b.answer) + ". " + esc(b.word) + "）</p>";
      if (mine !== b.answer) {
        html += '<button class="btn ghost small" onclick="addMistakeFromCloze(\'' + curCVersion + "'," + ep.no + "," + i + ')">加入错题库</button>';
      }
    });
    html += '<p class="muted">本篇答对 ' + right + " / " + total + " 空</p></div>";
  }
  html += "</div>";
  html += clozeWordsEpisodeHTML(curCVersion, ep.no);
  return html;
}
function fillClozeBlank(letter) {
  if (cShowAnswers) return;
  /* 已用的词移到当前选中的空 */
  Object.keys(cFills).forEach(function (k) { if (cFills[k] === letter) delete cFills[k]; });
  cFills[String(curClozeBlank)] = letter;
  /* 前进到下一个未填的空 */
  var next = -1;
  for (var i = 0; i < 10; i++) {
    var idx = (curClozeBlank + 1 + i) % 10;
    if (!cFills[String(idx)]) { next = idx; break; }
  }
  if (next >= 0) curClozeBlank = next;
  renderPractice();
}
function clearClozeBlank() {
  delete cFills[String(curClozeBlank)];
}
function addMistakeFromCloze(version, epNo, bi) {
  var ep = clozeEpisode(version, epNo);
  if (!ep) return;
  var b = ep.blanks[bi];
  var mine = cFills[String(bi)] || "未作答";
  var mineWord = "";
  if (mine && "ABCDEFGHIJKLMNO".indexOf(mine) >= 0) mineWord = ep.bank["ABCDEFGHIJKLMNO".indexOf(mine)];
  var bankText = (ep.bank || []).map(function (w, i) { return clozeBankLetter(i) + ". " + w; }).join("  ");
  openMistakeForm({
    module: "cloze",
    title: "选词填空 第" + epNo + "篇 第" + (26 + bi) + "空",
    question: "《" + ep.title + "》第" + (26 + bi) + "空\n词库：" + bankText,
    myAnswer: mine + (mineWord ? ". " + mineWord : ""),
    correctAnswer: b.answer + ". " + b.word
  });
}

    html += '<div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(x.word).replace(/'/g, "\\'") + '\')">读音</button><button class="btn ghost small" onclick="setCWordMastered(\'' + x.id + "'," + (!x.mastered) + ');renderPractice()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteCWord(\'' + x.id + '\');renderPractice()">删除</button></div></div>';
  });
  html += "</div>";
  return html;
}
function cwAutoFill() {
  var w = $("cw-input").value.trim();
  if (!w) { alert("先输入英文单词。"); return; }
  var hit = lookupLocal(w);
  if (hit) { $("cw-pos").value = hit.pos || ""; $("cw-mean").value = hit.meaning || ""; }
  else alert("本地词典里没有这个词，请自己填词性和中文。");
}
function cwAdd(edition, episode) {
  var w = $("cw-input").value.trim();
  var p = $("cw-pos").value.trim();
  var m = $("cw-mean").value.trim();
  if (!w) { alert("先输入英文单词。"); return; }

}

    html += '<div><button class="btn ghost small" onclick="speakWordTwice(\'' + esc(x.word).replace(/'/g, "\\'") + '\')">读音</button><button class="btn ghost small" onclick="setCWordMastered(\'' + x.id + "'," + (!x.mastered) + ');renderPractice()">' + (x.mastered ? "取消已掌握" : "标为已掌握") + '</button><button class="btn danger small" onclick="deleteCWord(\'' + x.id + '\');renderPractice()">删除</button></div></div>';

<script>
/* ============ 长篇匹配 ============ */
var M_VERSIONS = [
  { id: "basic", name: "基础版" },
  { id: "advanced", name: "进阶版" },
  { id: "exam", name: "四级真题版" }
];
var curMVersion = "basic";
var curMatchingEpisode = null; /* episode no */
var mAnswers = {}; /* qIndex 0-9 -> 段落字母 */
var mShowAnswers = false;
var mPage = 1;
var M_PAGE_SIZE = 10;

function matchingData(version) {
  if (version === "basic") return window.ENG_MATCHING_BASIC || [];
  if (version === "advanced") return window.ENG_MATCHING_ADVANCED || [];
  return window.ENG_MATCHING_REAL || [];
}
function matchingEpisode(version, no) {
  var eps = matchingData(version);
  for (var i = 0; i < eps.length; i++) { if (eps[i].no === no) return eps[i]; }
  return null;
}
function matchingVersionName(id) {
  for (var i = 0; i < M_VERSIONS.length; i++) { if (M_VERSIONS[i].id === id) return M_VERSIONS[i].name; }
  return id;
}

function renderMatchingHome() {

}

/* 长篇匹配文章渲染：每段标段号，单词是正常文字、只留虚线下划线（复用 tap-word 样式，绝不包方框）；标记笔模式下点词改为涂标记 */
function matchingPassageHTML(ep, edition, episode) {
  var marks = getMatchingEpisodeMarks(edition, episode);
  var out = "";
  (ep.paragraphs || []).forEach(function (p, pi) {
    out += '<h3>' + esc(p.label) + " 段</h3>";
    var pmarks = marks[String(pi)] || {};
    var parts = String(p.text || "").split("\n");
    parts.forEach(function (para, paraIdx) {
      if (!para.trim()) return;
      out += '<p class="passage">';
      var re = /[A-Za-z]+(?:'[A-Za-z]+)?|[0-9]+(?:[.,][0-9]+)?|[^A-Za-z0-9\s]+|\s+/g;
      var m;
      var wIdx = 0;
      while ((m = re.exec(para)) !== null) {
        var tok = m[0];
        if (/^[A-Za-z]/.test(tok)) {
          var key = paraIdx + ":" + wIdx;
          var mk = pmarks[key] || "";
          var cls = "tap-word" + (mk === "hl" ? " mark-hl" : mk === "ul" ? " mark-ul" : "");
          out += '<span class="' + cls + '" onclick="tapWordOrMarkMatching(\'' + tok.replace(/'/g, "\\'") + "','" + edition + "'," + episode + "," + pi + "," + paraIdx + "," + wIdx + ')">' + esc(tok) + "</span>";
          wIdx++;
        } else {
          out += esc(tok);
        }
      }
      out += "</p>";
    });
  });
  return out;
}
function tapWordOrMarkMatching(word, edition, episode, pi, paraIdx, wIdx) {
  if (penMode === "lookup") { tapWordMatching(word, edition, episode); return; }
  var marks = getMatchingEpisodeMarks(edition, episode);
  var pkey = String(pi);
  if (!marks[pkey]) marks[pkey] = {};
  var key = paraIdx + ":" + wIdx;
  if (penMode === "eraser") {
    delete marks[pkey][key];
  } else {
    var kind = penMode === "hl" ? "hl" : "ul";
    if (marks[pkey][key] === kind) delete marks[pkey][key];
    else marks[pkey][key] = kind;
  }
  if (Object.keys(marks[pkey]).length === 0) delete marks[pkey];
  setMatchingEpisodeMarks(edition, episode, marks);
  rerenderKeepScroll();
}
function clearAllMatchingMarks(edition, episode) {
  setMatchingEpisodeMarks(edition, episode, {});
  rerenderKeepScroll();
}
function tapWordMatching(word, edition, episode) {
  var hit = lookupLocal(word);
  var addBtn = '<button class="btn" onclick="addMatchingWordFromTap(\'' + edition + "'," + episode + ",'" + esc(word).replace(/'/g, "\\'") + '\')">记入本篇生词</button>';
  openModal(wordCardHTML(word, hit, addBtn));
}
function addMatchingWordFromTap(edition, episode, word) {
  var p = $("tw-pos") ? $("tw-pos").value.trim() : "";
  var m = $("tw-mean") ? $("tw-mean").value.trim() : "";
  if (!p || !m) { alert("词性和中文都要填。"); return; }
  addMatchingWord(edition, episode, word, p, m);
  closeModal();
  renderPractice();
}

function renderMatchingEpisode() {
  var ep = matchingEpisode(curMVersion, curMatchingEpisode);
  if (!ep) return renderMatchingHome();
  var vname = matchingVersionName(curMVersion);
  var html = '<button class="btn ghost" onclick="curMatchingEpisode=null;mShowAnswers=false;renderPractice()">‹ 返回' + esc(vname) + '列表</button>';
  var markCount = countMatchingMarks(curMVersion, ep.no);
  html += '<div class="pen-toolbar"><span class="lbl">标记笔：</span>';
  html += '<button class="' + (penMode === "lookup" ? "active" : "") + '" onclick="setPenMode(\'lookup\')">点词查词</button>';
  html += '<button class="' + (penMode === "hl" ? "active" : "") + '" onclick="setPenMode(\'hl\')">荧光笔</button>';
  html += '<button class="' + (penMode === "ul" ? "active" : "") + '" onclick="setPenMode(\'ul\')">下划线笔</button>';
  html += '<button class="' + (penMode === "eraser" ? "active" : "") + '" onclick="setPenMode(\'eraser\')">橡皮</button>';
  html += '<button onclick="clearAllMatchingMarks(\'' + curMVersion + "'," + ep.no + ')" ' + (markCount ? "" : "disabled") + ">清除全部标记（" + markCount + "）</button>";
  html += "</div>";
  html += '<div class="card"><h2>' + esc(vname) + " 第" + ep.no + "篇" + (ep.source ? " · " + esc(ep.source) : "") + "</h2>";
  html += "<h3>" + esc(ep.title) + "</h3>";
  var lastLabel = (ep.paragraphs || []).length ? ep.paragraphs[ep.paragraphs.length - 1].label : "L";
  html += '<p class="muted">先读文章，再给每句话选一段：点每句后面的下拉框选段号（A–' + esc(lastLabel) + '）。答完点自查看解析。</p>';

      html += '<option value="' + esc(lb) + '"' + (mAnswers[String(qi)] === lb ? " selected" : "") + ">" + esc(lb) + " 段</option>";

    html += "</select>";

      var mine = mAnswers[String(qi)] || "未作答";

    }
    html += "</div>";
  });
  html += '<div style="margin-top:12px"><button class="btn" onclick="mShowAnswers=true;renderPractice()" ' + (mShowAnswers ? "disabled" : "") + '>自查</button></div>';
  if (mShowAnswers) {
    var right = 0, total = 0;
    html += '<div class="answer-box open"><h3>本篇答案与解析</h3>';

      var mine = mAnswers[String(qi)] || "未作答";

      html += "<p><b>第" + (q.no || (36 + qi)) + "句：正确答案为 " + esc(q.answer) + " 段</b></p><p>" + esc(q.analysis || "") + "</p>";
      if (mine !== q.answer) {
        html += '<button class="btn ghost small" onclick="addMistakeFromMatching(\'' + curMVersion + "'," + ep.no + "," + qi + ')">加入错题库</button>';
      }
    });
    html += '<p class="muted">本篇答对 ' + right + " / " + total + " 题</p></div>";
  }
  html += "</div>";
  html += matchingWordsEpisodeHTML(curMVersion, ep.no);
  return html;
}
